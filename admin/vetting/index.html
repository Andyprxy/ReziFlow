<style>
    /* ---------------------------------------------------
       FLUID COMPACT LAYOUT & GRID ENFORCEMENT
       --------------------------------------------------- */
    .vetting-container { display: flex; flex-direction: row; width: 100%; height: 100%; gap: 0.5rem; overflow: hidden; }
    @media (min-width: 640px) { .vetting-container { gap: 1rem; } }

    .vetting-canvas { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; }

    .vetting-sidebar {
        width: 25%; max-width: 260px; min-width: 160px; flex-shrink: 0; 
        display: flex; flex-direction: column; gap: 0.75rem; overflow-y: auto; overflow-x: hidden;
        transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), min-width 0.4s; position: relative;
    }
    
    .vetting-sidebar.collapsed { width: 56px !important; min-width: 56px !important; }
    .vetting-sidebar.collapsed .nav-text { display: none !important; opacity: 0; }
    .vetting-sidebar.collapsed .nav-block { padding: 8px 4px !important; }
    .vetting-sidebar.collapsed .block-btn { padding: 10px 0 !important; justify-content: center !important; border-radius: 12px; }
    .vetting-sidebar.collapsed .block-btn i { margin: 0 !important; font-size: 1.1rem; }
    .vetting-sidebar.collapsed .engineered-pill { padding: 10px 0 !important; justify-content: center !important; }

    @media (max-width: 768px) { .vetting-sidebar { width: 28%; min-width: 130px; } }

    /* ---------------------------------------------------
       HIGH-DENSITY COMPONENT STYLES
       --------------------------------------------------- */
    .nav-block { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 1); box-shadow: 0 4px 20px -10px rgba(0,0,0,0.05); border-radius: 18px; padding: 12px; transition: all 0.3s ease; }
    .block-btn { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; transition: all 0.2s ease; cursor: pointer; white-space: nowrap; overflow: hidden; }
    .block-btn-active { background-color: #ffffff; color: #0071e3; border: 1.5px solid #0f172a; box-shadow: 0 4px 10px rgba(0,0,0,0.03); transform: scale(1.02); }
    .block-btn-inactive { background-color: transparent; color: #64748b; border: 1.5px solid transparent; }
    .block-btn-inactive:hover { background-color: rgba(255,255,255,0.6); color: #334155; }
    
    .btn-primary-blue { background-color: #0071e3; color: white; border: 1.5px solid #0071e3; box-shadow: 0 4px 12px rgba(0, 113, 227, 0.25); }
    .btn-primary-blue:hover { background-color: #005bb5; }
    .btn-secondary-white { background-color: #ffffff; color: #334155; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
    .btn-secondary-white:hover { border-color: #cbd5e1; background-color: #f8fafc; }

    .compact-table th { padding: 10px 12px; font-size: 0.55rem; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 800; color: #94a3b8; border-bottom: 1px solid rgba(226, 232, 240, 0.5); }
    .compact-table td { padding: 10px 12px; border-bottom: 1px solid rgba(226, 232, 240, 0.4); vertical-align: middle; font-size: 0.75rem; }
    .glass-panel { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); border-radius: 20px; }
</style>

<script>
    // ----------------------------------------------------
    // LOCAL STATE & GLOBALS
    // ----------------------------------------------------
    let currentFilter = 'pending'; let hubSubFilter = 'all';
    let currentRejectStudentId = null; let activeAllocationStudentId = null; let selectedRoomId = null;

    window.toggleVettingSidebar = function() {
        const sidebar = document.getElementById('vetting-right-sidebar');
        if(sidebar) {
            sidebar.classList.toggle('collapsed');
            const icon = document.getElementById('sidebar-vet-toggle-icon');
            if(icon) {
                if(sidebar.classList.contains('collapsed')) { icon.classList.remove('fa-chevron-right'); icon.classList.add('fa-chevron-left'); } 
                else { icon.classList.remove('fa-chevron-left'); icon.classList.add('fa-chevron-right'); }
            }
        }
    };
    
    if (window.innerWidth < 768) { window.toggleVettingSidebar(); }

    window.filterTable = function(inputId, tbodyId) {
        const input = document.getElementById(inputId); const filter = input.value.toLowerCase(); const tbody = document.getElementById(tbodyId); if(!tbody) return;
        const tr = tbody.getElementsByTagName('tr');
        for (let i = 0; i < tr.length; i++) {
            if (tr[i].classList.contains('no-results')) continue;
            tr[i].style.display = tr[i].textContent.toLowerCase().includes(filter) ? '' : 'none';
        }
    };

    function updateSegmentedActive(pfx, val, opts) { 
        opts.forEach(o => { const el = document.getElementById(`${pfx}-${o}`); if(el) el.classList.remove('active', 'accent-blue', 'accent-emerald', 'accent-amber'); }); 
        const aEl = document.getElementById(`${pfx}-${val}`); 
        if(aEl) { 
            aEl.classList.add('active'); 
            if(val === 'pending') aEl.classList.add('accent-amber'); 
            if(val === 'approved') aEl.classList.add('accent-emerald'); 
            if(val === 'allocation') aEl.classList.add('accent-blue'); 
        } 
    }

    // ----------------------------------------------------
    // RENDERING ENGINE (Binds to global scope for Mother to call)
    // ----------------------------------------------------
    window.setFilter = function(type) { 
        currentFilter = type; hubSubFilter = 'all'; 
        updateSegmentedActive('btn-tab', type, ['pending', 'approved', 'allocation']); 
        const titles = { 'pending': 'Student Hub (Pending)', 'approved': 'Approved Students', 'allocation': 'Allocation Engine' }; 
        if(document.getElementById('table-title')) document.getElementById('table-title').textContent = titles[type]; 
        window.renderUI(); 
    };

    window.setHubSubFilter = function(fv) { hubSubFilter = fv; window.renderUI(); };

    window.renderUI = function() {
        if (!globalStudentData) return;
        
        const pendingStudents = globalStudentData.filter(s => !s.Vetting_Status || String(s.Vetting_Status).trim() === '' || String(s.Vetting_Status).toLowerCase() === 'pending');
        const approvedStudents = globalStudentData.filter(s => String(s.Vetting_Status).toLowerCase().trim() === 'approved');
        
        if(document.getElementById('kpi-pending')) document.getElementById('kpi-pending').textContent = pendingStudents.length;
        if(document.getElementById('kpi-approved')) document.getElementById('kpi-approved').textContent = approvedStudents.length;
        if(document.getElementById('kpi-allocation')) document.getElementById('kpi-allocation').textContent = approvedStudents.length;

        const filterContainer = document.getElementById('hub-dynamic-filters'); const thead = document.getElementById('hub-thead'); const tbody = document.getElementById('hub-queue-body');
        if(!tbody) return;

        let htmlStr = '';
        
        if(currentFilter === 'pending' || currentFilter === 'approved') {
            let baseData = currentFilter === 'pending' ? pendingStudents : approvedStudents;
            const countAll = baseData.length; const countNsfas = baseData.filter(s => String(s.Funding_Type).toLowerCase().includes('nsfas')).length; const countBursary = baseData.filter(s => String(s.Funding_Type).toLowerCase().includes('bursary')).length; const countCash = baseData.filter(s => String(s.Funding_Type).toLowerCase().includes('cash')).length;

            if (filterContainer) filterContainer.innerHTML = `<button onclick="window.setHubSubFilter('all')" class="glass-seg-btn ${hubSubFilter==='all'?'active accent-blue':''} text-[9px]"><i class="fa-solid fa-users"></i> All <span class="ml-1 opacity-60">(${countAll})</span></button><button onclick="window.setHubSubFilter('nsfas')" class="glass-seg-btn ${hubSubFilter==='nsfas'?'active accent-blue':''} text-[9px]">NSFAS <span class="ml-1 opacity-60">(${countNsfas})</span></button><button onclick="window.setHubSubFilter('bursary')" class="glass-seg-btn ${hubSubFilter==='bursary'?'active accent-blue':''} text-[9px]">Bursary <span class="ml-1 opacity-60">(${countBursary})</span></button>`;
            
            if (hubSubFilter !== 'all') { baseData = baseData.filter(s => String(s.Funding_Type).toLowerCase().includes(hubSubFilter)); }
            
            if(thead) thead.innerHTML = `<tr class="bg-white/40 text-slate-400 uppercase tracking-widest font-bold text-[9px] border-b border-slate-200/50"><th class="w-1/4">Student Identity</th><th class="w-1/4">Academic Profile</th><th class="w-1/6">Funding</th><th class="w-1/6 text-center">Docs</th><th class="text-right">Action</th></tr>`;

            if(baseData.length === 0) { tbody.innerHTML = `<tr class="no-results"><td colspan="5" class="p-16 text-center text-slate-400 bg-white/30"><div class="w-12 h-12 rounded-full bg-white border border-slate-200 text-slate-300 flex items-center justify-center mx-auto mb-4 text-xl"><i class="fa-solid fa-check-double"></i></div><span class="font-medium text-xs">No records match this view.</span></td></tr>`; return; }

            baseData.forEach(s => {
                htmlStr += `
                    <tr class="hover:bg-white/80 transition-colors group">
                        <td><div class="font-black text-slate-800 text-[11px]">${s.Student_Number || 'Unassigned'}</div><div class="text-[9px] font-semibold text-slate-500 mt-0.5">${s.First_Name || ''} ${s.Surname || ''}</div></td>
                        <td><div class="text-slate-700 font-bold text-[10px]">${s.Course || 'Unknown Course'}</div><div class="text-[8px] font-bold text-slate-400 uppercase mt-0.5"><i class="fa-solid fa-location-dot mr-1 text-slate-300"></i>${s.Campus_Hub || 'N/A'}</div></td>
                        <td><span class="px-2 py-1 bg-white border border-slate-200 text-slate-600 rounded-lg text-[8px] font-bold uppercase tracking-wider shadow-sm">${s.Funding_Type || 'Pending'}</span></td>
                        <td class="text-center"><span class="text-[8px] font-bold text-slate-400 uppercase border border-dashed border-slate-300 bg-white/50 px-2 py-1 rounded-lg">Awaiting</span></td>
                        <td class="text-right">
                            <div class="flex justify-end gap-1.5">
                                ${currentFilter === 'pending' ? `<button onclick="window.openRejectModal('${s.Student_Number || ''}')" class="bg-white border border-rose-200 hover:bg-rose-50 text-rose-600 text-[9px] font-bold px-3 py-1.5 rounded-lg transition-all shadow-sm">Reject</button><button onclick="window.processApproval('${s.Student_Number}')" class="bg-[#1d1d1f] hover:bg-blue-600 text-white shadow-md text-[9px] font-bold px-3 py-1.5 rounded-lg transition-all">Process</button>` : `<button class="bg-slate-100 text-slate-400 cursor-not-allowed text-[9px] font-bold px-3 py-1.5 rounded-lg border border-slate-200 transition-all" disabled>Approved</button>`}
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = htmlStr;

        } else if (currentFilter === 'allocation') {
            let baseData = [...approvedStudents];
            if(thead) thead.innerHTML = `<tr class="bg-white/40 text-slate-400 uppercase tracking-widest font-bold text-[9px] border-b border-slate-200/50"><th class="w-1/3">Student Identity</th><th class="w-1/4">Gender</th><th class="w-1/4">Current Status</th><th class="text-right">Action</th></tr>`;
            
            if(baseData.length === 0) { tbody.innerHTML = `<tr class="no-results"><td colspan="4" class="p-16 text-center text-slate-400 bg-white/30">No approved students to allocate.</td></tr>`; return; }

            baseData.forEach(s => {
                const roomStatus = s.Room_Allocation && s.Room_Allocation !== '--' && s.Room_Allocation !== 'Unassigned' ? `<span class="bg-emerald-50 border border-emerald-200 text-emerald-600 px-2 py-1 rounded-lg text-[8px] font-bold uppercase tracking-wider shadow-sm">${s.Room_Allocation}</span>` : `<span class="bg-white border border-amber-200 text-amber-600 px-2 py-1 rounded-lg text-[8px] font-bold uppercase tracking-wider shadow-sm">Unassigned</span>`;
                htmlStr += `
                    <tr class="hover:bg-white/80 transition-colors">
                        <td><div class="font-black text-slate-800 text-[11px]">${s.Student_Number || '--'}</div><div class="text-[9px] text-slate-500 mt-0.5 font-medium">${s.First_Name || ''} ${s.Surname || ''}</div></td>
                        <td><div class="text-slate-600 font-bold text-[10px]">${s.Gender || 'N/A'}</div></td>
                        <td>${roomStatus}</td>
                        <td class="text-right"><button onclick="window.openAllocationModal('${s.Student_Number}', '${s.Gender}', '${s.First_Name} ${s.Surname}')" class="bg-[#1d1d1f] hover:bg-blue-600 text-white text-[9px] font-bold px-3 py-1.5 rounded-lg transition-all shadow-md">Allocate</button></td>
                    </tr>
                `;
            });
            tbody.innerHTML = htmlStr;
        }
    };

    // ----------------------------------------------------
    // ACTIONS & MODALS
    // ----------------------------------------------------
    window.processApproval = function(studentId) { const s = globalStudentData.find(s => String(s.Student_Number) === String(studentId)); if (s) window.openAllocationModal(s.Student_Number, s.Gender, `${s.First_Name || ''} ${s.Surname || ''}`); };
    
    window.openRejectModal = function(studentId) { currentRejectStudentId = studentId; document.getElementById('reject-student-id').textContent = studentId; document.getElementById('rejectForm').reset(); document.getElementById('rejectModal').classList.add('active'); };
    window.closeRejectModal = function() { document.getElementById('rejectModal').classList.remove('active'); };
    
    window.submitRejection = async function(e) {
        e.preventDefault(); const btn = document.getElementById('btn-submit-reject'); const checkboxes = document.querySelectorAll('input[name="reason"]:checked'); const reasons = Array.from(checkboxes).map(cb => cb.value);
        if (reasons.length === 0) { if(typeof showToast==='function') showToast("Please select a reason.", "error"); return; }
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...'; btn.disabled = true;
        try {
            if(typeof executeActionHook === 'function') executeActionHook('https://n8n.automania.cloud/webhook/reziflow-reject', { Student_Number: currentRejectStudentId, Reasons: reasons.join(", ") });
            await new Promise(r => setTimeout(r, 400)); window.closeRejectModal();
            const idx = globalStudentData.findIndex(s => String(s.Student_Number) === String(currentRejectStudentId)); if (idx > -1) globalStudentData[idx].Vetting_Status = 'Rejected';
            window.renderUI(); if(typeof showToast==='function') showToast("Rejected successfully.");
        } catch(err) {} finally { btn.innerHTML = 'Submit Rejection & Notify'; btn.disabled = false; }
    };

    window.openAllocationModal = function(studentId, gender, name) {
        activeAllocationStudentId = studentId; selectedRoomId = null;
        document.getElementById('alloc-student-name').textContent = name; document.getElementById('alloc-student-id').textContent = studentId;
        document.getElementById('alloc-selected-room').textContent = 'None';
        document.getElementById('btn-confirm-allocation').disabled = true; document.getElementById('btn-confirm-allocation').classList.add('opacity-50');
        document.getElementById('allocationModal').classList.add('active'); window.fetchModalRoomInventory(gender);
    };
    window.closeAllocationModal = function() { document.getElementById('allocationModal').classList.remove('active'); };

    window.fetchModalRoomInventory = async function(gender) {
        const singleContainer = document.getElementById('list-single-rooms'); const sharingContainer = document.getElementById('list-sharing-rooms');
        if(globalRoomData && globalRoomData.length > 0) { window.renderModalRooms(globalRoomData, gender, singleContainer, sharingContainer); return; }
        singleContainer.innerHTML = '<div class="py-5 text-center text-blue-500"><i class="fa-solid fa-circle-notch fa-spin"></i></div>';
    };

    window.renderModalRooms = function(roomsData, gender, singleContainer, sharingContainer) {
        let validRooms = roomsData.filter(r => { const occupied = parseInt(r.Occupied_Beds) || parseInt(r.Occupied) || 0; const total = parseInt(r.Total_Beds) || parseInt(r.Capacity) || 1; return occupied < total; });
        const cleanGender = String(gender || '').toLowerCase().trim(); const isMale = cleanGender.startsWith('m'); 
        if (isMale) { validRooms = validRooms.filter(r => String(r.Block || '').toUpperCase().trim() === 'A'); } 
        else { validRooms = validRooms.filter(r => { const blk = String(r.Block || '').toUpperCase().trim(); return blk === 'B' || blk === 'C'; }); }
        
        const singles = validRooms.filter(r => String(r.Room_Type || '').toLowerCase().includes('single')); 
        const sharing = validRooms.filter(r => String(r.Room_Type || '').toLowerCase().includes('sharing'));
        
        let sHtml = '';
        if (singles.length === 0) sHtml = '<div class="p-4 text-center text-[10px] text-slate-400 border border-dashed rounded-xl border-slate-200">No singles available</div>';
        else singles.forEach(r => sHtml += `<div onclick="window.selectRoom(this, '${r.Room_ID}')" class="room-card p-3 bg-white border border-slate-200 rounded-xl mb-2 cursor-pointer hover:border-blue-400 text-xs font-bold text-slate-700">${r.Room_ID}</div>`);
        singleContainer.innerHTML = sHtml;

        let shHtml = '';
        if (sharing.length === 0) shHtml = '<div class="p-4 text-center text-[10px] text-slate-400 border border-dashed rounded-xl border-slate-200">No sharing available</div>';
        else sharing.forEach(r => shHtml += `<div onclick="window.selectRoom(this, '${r.Room_ID}')" class="room-card p-3 bg-white border border-slate-200 rounded-xl mb-2 cursor-pointer hover:border-blue-400 text-xs font-bold text-slate-700">${r.Room_ID} <span class="text-[9px] font-normal text-emerald-500 float-right">Open</span></div>`);
        sharingContainer.innerHTML = shHtml;
    };

    window.selectRoom = function(el, roomId) {
        document.querySelectorAll('.room-card').forEach(c => { c.classList.remove('bg-blue-50', 'border-blue-500', 'text-blue-700'); c.classList.add('bg-white', 'border-slate-200', 'text-slate-700'); });
        el.classList.remove('bg-white', 'border-slate-200', 'text-slate-700'); el.classList.add('bg-blue-50', 'border-blue-500', 'text-blue-700');
        selectedRoomId = roomId; document.getElementById('alloc-selected-room').textContent = roomId;
        document.getElementById('btn-confirm-allocation').disabled = false; document.getElementById('btn-confirm-allocation').classList.remove('opacity-50');
    };

    window.confirmAllocation = async function() {
        const btn = document.getElementById('btn-confirm-allocation'); btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Binding...'; btn.disabled = true;
        try {
            const studentIndex = globalStudentData.findIndex(s => String(s.Student_Number) === String(activeAllocationStudentId));
            const needsApproval = !globalStudentData[studentIndex].Vetting_Status || String(globalStudentData[studentIndex].Vetting_Status).toLowerCase() !== 'approved';
            if (needsApproval && typeof executeActionHook === 'function') executeActionHook('https://n8n.automania.cloud/webhook/reziflow-approve', { Student_Number: activeAllocationStudentId, Vetting_Status: "Approved" });
            if (typeof executeActionHook === 'function') executeActionHook('https://n8n.automania.cloud/webhook/reziflow-allocate', { Student_Number: activeAllocationStudentId, Room_ID: selectedRoomId });
            await new Promise(r => setTimeout(r, 600));
            if (needsApproval) globalStudentData[studentIndex].Vetting_Status = 'Approved';
            globalStudentData[studentIndex].Room_Allocation = selectedRoomId; 
            window.closeAllocationModal(); window.setFilter(currentFilter === 'pending' ? 'approved' : 'allocation');
            if(typeof showToast==='function') showToast("Room bound successfully.");
        } catch (err) {} finally { btn.innerHTML = 'Confirm & Bind'; btn.disabled = false; }
    };

    window.submitManualStudent = async function(e) {
        e.preventDefault(); const btn = document.getElementById('btn-submit-manual'); const ogText = btn.innerHTML;
        const payload = { First_Name: document.getElementById('manual-fname').value, Surname: document.getElementById('manual-lname').value, Student_Number: document.getElementById('manual-id').value, Gender: document.getElementById('manual-gender').value, Funding_Type: document.getElementById('manual-funding').value, Vetting_Status: 'Pending', Manual_Entry: true };
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Injecting...'; btn.disabled = true;
        try {
            await fetch('https://n8n.automania.cloud/webhook/reziflow-manual-student', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            document.getElementById('manualStudentModal').classList.remove('active'); e.target.reset();
            if(typeof fetchDatabaseData === 'function') fetchDatabaseData(true); if(typeof showToast === 'function') showToast("Applicant manually injected.");
        } catch(error) { alert("Failed to connect to n8n."); } finally { btn.innerHTML = ogText; btn.disabled = false; }
    };

    // Auto-trigger render immediately upon script execution if data exists
    requestAnimationFrame(() => { if (globalStudentData && globalStudentData.length > 0) window.renderUI(); });
</script>
