<style>
    /* ---------------------------------------------------
       FLUID COMPACT LAYOUT & GRID ENFORCEMENT
       --------------------------------------------------- */
    .vetting-container {
        display: flex; flex-direction: row; width: 100%; height: 100%; gap: 0.5rem; overflow: hidden;
    }
    @media (min-width: 640px) { .vetting-container { gap: 1rem; } }

    .vetting-canvas {
        flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden;
    }

    .vetting-sidebar {
        width: 25%; max-width: 260px; min-width: 160px; flex-shrink: 0; 
        display: flex; flex-direction: column; gap: 0.75rem; overflow-y: auto; overflow-x: hidden;
        transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), min-width 0.4s; position: relative;
    }
    
    .vetting-sidebar.collapsed { width: 56px !important; min-width: 56px !important; }
    .vetting-sidebar.collapsed .nav-text { display: none !important; opacity: 0; }
    .vetting-sidebar.collapsed .nav-block { padding: 8px 4px !important; }
    .vetting-sidebar.collapsed .block-btn { padding: 10px 0 !important; justify-content: center !important; border-radius: 12px; }
    .vetting-sidebar.collapsed .block-btn i { margin: 0 !important; font-size: 1.1rem; }
    .vetting-sidebar.collapsed .engineered-pill { padding: 10px 0 !important; justify-content: center !important; }

    @media (max-width: 768px) { .vetting-sidebar { width: 28%; min-width: 130px; } }

    /* ---------------------------------------------------
       HIGH-DENSITY COMPONENT STYLES
       --------------------------------------------------- */
    .nav-block {
        background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 1); box-shadow: 0 4px 20px -10px rgba(0,0,0,0.05);
        border-radius: 18px; padding: 12px; transition: all 0.3s ease;
    }
    .block-btn {
        width: 100%; display: flex; align-items: center; gap: 8px;
        padding: 8px 12px; border-radius: 12px; font-size: 0.7rem;
        font-weight: 700; transition: all 0.2s ease; cursor: pointer; white-space: nowrap; overflow: hidden;
    }
    .block-btn-active { background-color: #ffffff; color: #0071e3; border: 1.5px solid #0f172a; box-shadow: 0 4px 10px rgba(0,0,0,0.03); transform: scale(1.02); }
    .block-btn-inactive { background-color: transparent; color: #64748b; border: 1.5px solid transparent; }
    .block-btn-inactive:hover { background-color: rgba(255,255,255,0.6); color: #334155; }
    
    .btn-primary-blue { background-color: #0071e3; color: white; border: 1.5px solid #0071e3; box-shadow: 0 4px 12px rgba(0, 113, 227, 0.25); }
    .btn-primary-blue:hover { background-color: #005bb5; }
    .btn-secondary-white { background-color: #ffffff; color: #334155; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
    .btn-secondary-white:hover { border-color: #cbd5e1; background-color: #f8fafc; }

    .compact-table th { padding: 10px 12px; font-size: 0.55rem; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 800; color: #94a3b8; border-bottom: 1px solid rgba(226, 232, 240, 0.5); }
    .compact-table td { padding: 10px 12px; border-bottom: 1px solid rgba(226, 232, 240, 0.4); vertical-align: middle; font-size: 0.75rem; }
    
    .glass-panel { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); border-radius: 20px; }
    
    /* ---------------------------------------------------
       HIGH-END ANIMATED MODALS
       --------------------------------------------------- */
    .modal-overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 2000; display: flex; align-items: center; justify-content: center; position: fixed; inset: 0; padding: 1rem; background: transparent; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .magic-border-container {
        position: relative; padding: 3px; border-radius: 28px; overflow: hidden;
        background: transparent; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        transform: scale(0.95) translateY(20px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1);
    }
    .modal-overlay.active .magic-border-container { transform: scale(1) translateY(0); }
    
    .magic-border-container::before {
        content: ''; position: absolute; top: 50%; left: 50%; width: 200%; height: 200%;
        background: conic-gradient(from 0deg, transparent 40%, rgba(0, 113, 227, 0.2) 60%, #0071e3 80%, #3b82f6 100%);
        transform-origin: 0 0; animation: magic-spin 3s linear infinite; z-index: 0;
    }
    @keyframes magic-spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    
    .magic-border-inner { position: relative; z-index: 10; background: #ffffff; border-radius: 25px; width: 100%; height: 100%; padding: 1.25rem 1.5rem; }
</style>

<div class="vetting-container custom-scroll">
    
    <div class="vetting-canvas custom-scroll pr-1 pb-10">
        
        <div class="flex justify-start sm:justify-center w-full mb-4">
            <div id="hub-dynamic-filters" class="glass-segmented shadow-sm w-full sm:w-auto overflow-x-auto custom-scroll flex-nowrap bg-white/60 p-1 rounded-[14px] border border-white flex items-center min-h-[36px]">
                </div>
        </div>

        <div class="glass-panel overflow-hidden">
            <div class="px-4 py-3 border-b border-white/60 flex flex-col sm:flex-row gap-3 justify-between sm:items-center bg-white/50 backdrop-blur-md">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center shadow-sm"><i id="hub-icon" class="fa-solid fa-users text-[10px]"></i></div>
                    <h3 id="table-title" class="font-black text-slate-800 text-xs sm:text-sm tracking-tight">Student Hub (Pending)</h3>
                </div>
                <div class="flex items-center gap-2 flex-wrap md:flex-nowrap">
                    <div class="relative w-full sm:w-48">
                        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 transform -translate-y-1/2 text-slate-400 text-[9px]"></i>
                        <input type="text" id="search-hub" onkeyup="filterTable('search-hub', 'hub-queue-body')" placeholder="Search records..." class="w-full bg-white/80 border border-slate-200 rounded-lg py-1.5 pl-7 pr-2 text-[9px] font-medium text-slate-700 outline-none focus:border-blue-400 shadow-sm">
                    </div>
                    <button onclick="downloadHubReport()" class="bg-[#1d1d1f] hover:bg-[#333336] text-white font-bold px-2.5 py-1.5 rounded-lg shadow-sm flex items-center gap-1.5 text-[9px]"><i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Export</span></button>
                    <button onclick="if(typeof fetchDatabaseData === 'function') fetchDatabaseData(true);" class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-600 font-bold px-2.5 py-1.5 rounded-lg shadow-sm"><i class="fa-solid fa-rotate text-blue-500 text-[10px]"></i></button>
                </div>
            </div>
            
            <div class="overflow-x-auto custom-scroll bg-white/30 backdrop-blur-sm max-h-[70vh]">
                <table class="w-full text-left border-collapse compact-table min-w-[700px]">
                    <thead id="hub-thead" class="bg-white/70 sticky top-0 backdrop-blur-md z-10 shadow-sm">
                        </thead>
                    <tbody id="hub-queue-body" class="divide-y divide-slate-100/50">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <div id="vetting-right-sidebar" class="vetting-sidebar custom-scroll">
        
        <div onclick="window.toggleVettingSidebar()" class="nav-block flex items-center justify-between !p-2 cursor-pointer hover:bg-white/80 transition-colors group">
            <div class="flex items-center gap-2 w-full">
                <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-teal-400 rounded-[10px] shadow-sm flex items-center justify-center text-white text-xs flex-shrink-0 transition-transform group-hover:scale-105">
                    <i class="fa-solid fa-address-card"></i>
                </div>
                <div class="flex flex-col nav-text flex-1 overflow-hidden">
                    <span class="font-black text-[11px] tracking-tight text-slate-900 leading-none truncate">Hub<span class="text-blue-500">Ctrl</span></span>
                    <span class="text-[7px] font-bold tracking-widest text-slate-400 uppercase mt-0.5 truncate">Pipeline Toggle</span>
                </div>
            </div>
            <i id="sidebar-vet-toggle-icon" class="fa-solid fa-chevron-right text-slate-300 text-[9px] nav-text pr-1 transition-transform group-hover:translate-x-1"></i>
        </div>

        <div class="nav-block">
            <p class="px-1 text-[7px] font-extrabold text-slate-400 uppercase tracking-widest mb-1.5 nav-text truncate">Applicant Pipeline</p>
            <div class="space-y-1">
                <button onclick="window.triggerSidebarFilter('pending', this)" id="nav-btn-pending" class="block-btn block-btn-active" title="Unvetted Queue">
                    <i class="fa-solid fa-clock-rotate-left text-[13px] w-4 text-center text-amber-500"></i> 
                    <span class="nav-text truncate text-[9px] flex-1 text-left">Unvetted Queue</span>
                    <span id="kpi-pending-side" class="nav-text bg-amber-50 border border-amber-100 text-amber-600 px-1.5 py-0.5 rounded text-[7px] ml-auto font-black shadow-sm">-</span>
                </button>
                <button onclick="window.triggerSidebarFilter('approved', this)" id="nav-btn-approved" class="block-btn block-btn-inactive" title="Vetted Archive">
                    <i class="fa-solid fa-user-check text-[13px] w-4 text-center text-emerald-500"></i> 
                    <span class="nav-text truncate text-[9px] flex-1 text-left">Vetted Archive</span>
                    <span id="kpi-approved-side" class="nav-text bg-emerald-50 border border-emerald-100 text-emerald-600 px-1.5 py-0.5 rounded text-[7px] ml-auto font-black shadow-sm">-</span>
                </button>
            </div>
        </div>

        <div class="nav-block">
            <p class="px-1 text-[7px] font-extrabold text-slate-400 uppercase tracking-widest mb-1.5 nav-text truncate">Space Planning</p>
            <div class="space-y-1">
                <button onclick="window.triggerSidebarFilter('allocation', this)" id="nav-btn-allocation" class="block-btn block-btn-inactive" title="Allocation Engine">
                    <i class="fa-solid fa-door-open text-[13px] w-4 text-center text-blue-500"></i> 
                    <span class="nav-text truncate text-[9px]">Allocation Engine</span>
                </button>
            </div>
        </div>

        <div class="nav-block">
            <p class="px-1 text-[7px] font-extrabold text-slate-400 uppercase tracking-widest mb-1.5 nav-text truncate">Quick Actions</p>
            <div class="space-y-1.5">
                <button onclick="document.getElementById('manualStudentModal').classList.add('active')" class="block-btn btn-primary-blue justify-center gap-1.5 !py-2" title="Manual Entry">
                    <i class="fa-solid fa-user-plus text-[10px]"></i> 
                    <span class="nav-text truncate text-[9px]">Manual Entry</span>
                </button>
            </div>
        </div>

        <div class="mt-auto flex-shrink-0 relative overflow-hidden bg-[#111827] p-2 rounded-[14px] border border-slate-700 shadow-xl flex items-center gap-2 engineered-pill">
            <div class="w-6 h-6 rounded-full bg-white/10 flex items-center justify-center text-white border border-white/20 flex-shrink-0"><i class="fa-solid fa-bolt text-[8px]"></i></div>
            <div class="flex flex-col relative z-10 nav-text overflow-hidden">
                <span class="text-[6px] font-bold text-slate-400 uppercase tracking-widest truncate">Engineered</span>
                <span class="text-[9px] font-black text-white tracking-widest mt-0.5 truncate">AUTOMANIA</span>

        </div>

    </div>
</div>

<div id="manualStudentModal" class="modal-overlay">
    <div class="modal-content magic-border-container w-full max-w-md">
        <div class="magic-border-inner flex flex-col relative">
            <button onclick="document.getElementById('manualStudentModal').classList.remove('active')" class="absolute top-0 right-0 w-6 h-6 bg-slate-50 border border-slate-200 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-100 transition-colors"><i class="fa-solid fa-xmark text-[10px]"></i></button>
            <div class="flex items-center gap-3 mb-4">
                <div class="w-8 h-8 bg-blue-50 text-blue-600 border border-blue-100 rounded-lg flex items-center justify-center text-sm"><i class="fa-solid fa-address-card"></i></div>
                <div>
                    <h2 class="text-lg font-black text-slate-900 tracking-tight leading-none">Add Applicant</h2>
                    <p class="text-[9px] font-bold text-slate-400 mt-1 uppercase tracking-widest">Bypass Registration Portal</p>
                </div>
            </div>
            <form onsubmit="submitManualStudent(event)">
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-[7px] sm:text-[8px] font-bold text-slate-500 uppercase tracking-widest mb-1 pl-1">First Name</label>
                        <input type="text" id="manual-fname" class="w-full bg-white border border-slate-200 rounded-xl py-2 px-3 text-[9px] font-medium outline-none focus:border-blue-400 shadow-sm" required>
                    </div>
                    <div>
                        <label class="block text-[7px] sm:text-[8px] font-bold text-slate-500 uppercase tracking-widest mb-1 pl-1">Surname</label>
                        <input type="text" id="manual-lname" class="w-full bg-white border border-slate-200 rounded-xl py-2 px-3 text-[9px] font-medium outline-none focus:border-blue-400 shadow-sm" required>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-[7px] sm:text-[8px] font-bold text-slate-500 uppercase tracking-widest mb-1 pl-1">Student Number</label>
                        <input type="text" id="manual-id" class="w-full bg-white border border-slate-200 rounded-xl py-2 px-3 text-[9px] font-medium outline-none focus:border-blue-400 shadow-sm font-mono" required>
                    </div>
                    <div>
                        <label class="block text-[7px] sm:text-[8px] font-bold text-slate-500 uppercase tracking-widest mb-1 pl-1">Gender</label>
                        <select id="manual-gender" class="w-full bg-white border border-slate-200 rounded-xl py-2 px-3 text-[9px] font-medium outline-none focus:border-blue-400 shadow-sm" required>
                            <option value="" disabled selected>Select...</option>
                            <option value="Male">Male</option><option value="Female">Female</option>
                        </select>
                    </div>
                </div>
                <div class="mb-5">
                    <label class="block text-[7px] sm:text-[8px] font-bold text-slate-500 uppercase tracking-widest mb-1 pl-1">Funding Type</label>
                    <select id="manual-funding" class="w-full bg-white border border-slate-200 rounded-xl py-2 px-3 text-[9px] font-medium outline-none focus:border-blue-400 shadow-sm" required>
                        <option value="NSFAS">NSFAS</option>
                        <option value="Bursary">Private Bursary</option>
                        <option value="Cash">Cash Paying</option>
                    </select>
                </div>
                <button type="submit" id="btn-submit-manual" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-[10px] py-2.5 shadow-md flex justify-center items-center gap-2 text-[10px] sm:text-xs">Inject to Pipeline <i class="fa-solid fa-arrow-right-to-bracket"></i></button>
            </form>
        </div>
    </div>
</div>

<script>
    // ----------------------------------------------------
    // RESPONSIVE SIDEBAR TOGGLE
    // ----------------------------------------------------
    window.toggleVettingSidebar = function() {
        const sidebar = document.getElementById('vetting-right-sidebar');
        if(sidebar) {
            sidebar.classList.toggle('collapsed');
            const icon = document.getElementById('sidebar-vet-toggle-icon');
            if(icon) {
                if(sidebar.classList.contains('collapsed')) {
                    icon.classList.remove('fa-chevron-right'); icon.classList.add('fa-chevron-left');
                } else {
                    icon.classList.remove('fa-chevron-left'); icon.classList.add('fa-chevron-right');
                }
            }
        }
    };
    
    if (window.innerWidth < 768) {
        const sidebar = document.getElementById('vetting-right-sidebar');
        if(sidebar) {
            sidebar.classList.add('collapsed');
            const icon = document.getElementById('sidebar-vet-toggle-icon');
            if(icon) { icon.classList.remove('fa-chevron-right'); icon.classList.add('fa-chevron-left'); }
        }
    }

    // ----------------------------------------------------
    // SIDEBAR -> MOTHER PAGE FILTER SYNC
    // ----------------------------------------------------
    window.triggerSidebarFilter = function(filterType, btnElement) {
        // Update sidebar button states
        document.querySelectorAll('#vetting-right-sidebar .block-btn-active').forEach(btn => {
            btn.classList.remove('block-btn-active'); btn.classList.add('block-btn-inactive');
        });
        if(btnElement) {
            btnElement.classList.remove('block-btn-inactive'); btnElement.classList.add('block-btn-active');
        }

        // Call the mother page's setFilter function to redraw the table
        if(typeof setFilter === 'function') {
            setFilter(filterType);
        }
    };

    // Keep sidebar KPIs synced with mother page counts
    setInterval(() => {
        const topPending = document.getElementById('kpi-pending');
        const sidePending = document.getElementById('kpi-pending-side');
        if(topPending && sidePending) sidePending.textContent = topPending.textContent;

        const topApproved = document.getElementById('kpi-approved');
        const sideApproved = document.getElementById('kpi-approved-side');
        if(topApproved && sideApproved) sideApproved.textContent = topApproved.textContent;
    }, 1000);

    // ----------------------------------------------------
    // MANUAL STUDENT INJECTION (n8n Webhook Hookup)
    // ----------------------------------------------------
    window.submitManualStudent = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-submit-manual'); const ogText = btn.innerHTML;
        
        const payload = {
            First_Name: document.getElementById('manual-fname').value,
            Surname: document.getElementById('manual-lname').value,
            Student_Number: document.getElementById('manual-id').value,
            Gender: document.getElementById('manual-gender').value,
            Funding_Type: document.getElementById('manual-funding').value,
            Vetting_Status: 'Pending',
            Manual_Entry: true
        };

        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Injecting...'; btn.disabled = true;

        try {
            // Replace with your actual n8n webhook for manual entry if needed
            await fetch('https://n8n.automania.cloud/webhook/reziflow-manual-student', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            document.getElementById('manualStudentModal').classList.remove('active'); e.target.reset();
            
            // Force mother page to refresh global cache
            if(typeof fetchDatabaseData === 'function') fetchDatabaseData(true); 
            if(typeof showToast === 'function') showToast("Applicant manually injected to pipeline.");
        } catch(error) { 
            alert("Failed to connect to n8n pipeline."); 
        } finally { 
            btn.innerHTML = ogText; btn.disabled = false; 
        }
    }
</script>
