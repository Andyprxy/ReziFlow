<div class="glass-panel rounded-[24px] lg:rounded-[32px] overflow-hidden">
    <div class="px-4 sm:px-6 lg:px-8 py-5 border-b border-white/60 flex flex-col md:flex-row gap-4 justify-between md:items-center bg-white/50 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center shadow-sm"><i class="fa-solid fa-screwdriver-wrench text-sm"></i></div>
            <h3 class="font-bold text-slate-800 text-base sm:text-lg">Facility Maintenance Ops</h3>
        </div>
        <div class="flex items-center gap-3 flex-wrap md:flex-nowrap justify-end">
            <div class="glass-segmented">
                <button onclick="setMaintenanceStatus('all')" id="maint-stat-all" class="glass-seg-btn active accent-blue">All Tickets</button>
                <button onclick="setMaintenanceStatus('open')" id="maint-stat-open" class="glass-seg-btn accent-blue">Open</button>
                <button onclick="setMaintenanceStatus('closed')" id="maint-stat-closed" class="glass-seg-btn accent-blue">Resolved</button>
            </div>
            <div class="relative w-full sm:w-48">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="search-maintenance" onkeyup="filterTable('search-maintenance', 'maintenance-body')" placeholder="Search tickets..." class="modern-input search-input py-2 bg-white/80">
            </div>
            <button onclick="downloadReport('maintenance')" class="bg-[#1d1d1f] hover:bg-[#333336] text-white font-bold px-4 py-2 rounded-xl transition-all shadow-md flex items-center gap-1.5 flex-shrink-0 text-sm"><i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Report</span></button>
            <button onclick="fetchMaintenanceData(true)" class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-600 font-bold px-4 py-2 rounded-xl transition-all shadow-sm flex items-center gap-1.5 flex-shrink-0 text-sm"><i class="fa-solid fa-rotate text-blue-500"></i></button>
        </div>
    </div>
    <div class="overflow-x-auto custom-scroll bg-white/30 backdrop-blur-sm">
        <table class="w-full text-left text-sm border-collapse min-w-[700px]">
            <thead>
                <tr class="bg-white/40 text-slate-400 uppercase tracking-widest font-bold text-[10px] border-b border-slate-200/50">
                    <th class="p-4 sm:p-6">Ticket ID</th>
                    <th class="p-4 sm:p-6">Resident & Room</th>
                    <th class="p-4 sm:p-6">Category</th>
                    <th class="p-4 sm:p-6">Description</th>
                    <th class="p-4 sm:p-6 text-right">Ops Action</th>
                </tr>
            </thead>
            <tbody id="maintenance-body" class="divide-y divide-slate-100/50"></tbody>
        </table>
    </div>
</div>
