<div class="glass-panel rounded-[24px] lg:rounded-[32px] p-6 lg:p-10 max-w-6xl mx-auto relative overflow-hidden animate-[paneFade_0.4s_cubic-bezier(0.16,1,0.3,1)_forwards]">
    <div class="flex items-center justify-between mb-8 border-b border-slate-200/60 pb-6">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-blue-400 text-white flex items-center justify-center text-xl shadow-md shadow-indigo-500/20"><i class="fa-solid fa-van-shuttle"></i></div>
            <div>
                <h2 class="text-xl sm:text-2xl font-black text-slate-800 tracking-tight">Transport Operations</h2>
                <p class="text-xs text-slate-500 font-medium">Live shuttle tracking and driver dispatching</p>
            </div>
        </div>
        <div class="hidden sm:flex items-center gap-2">
            <span class="bg-emerald-50 text-emerald-600 text-[10px] font-bold px-3 py-1.5 rounded-full border border-emerald-100 flex items-center gap-1.5 shadow-sm"><div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div> Fleet Online</span>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 h-[400px] bg-slate-100/50 rounded-2xl border border-white shadow-inner relative overflow-hidden flex items-center justify-center">
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10 mix-blend-multiply"></div>
            <div class="text-center relative z-10 p-6 bg-white/80 backdrop-blur-xl rounded-2xl border border-white shadow-lg">
                <div class="w-16 h-16 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center text-3xl shadow-sm mx-auto mb-4 border border-blue-100"><i class="fa-solid fa-map-location-dot"></i></div>
                <h3 class="font-black text-slate-800 text-lg">Live Map Offline</h3>
                <p class="text-xs text-slate-500 font-medium mt-1">Awaiting Google Maps API Integration</p>
            </div>
        </div>
        
        <div class="flex flex-col gap-4">
            <div class="bg-white/60 p-5 rounded-2xl border border-white shadow-sm flex flex-col gap-3">
                <div class="flex justify-between items-center border-b border-slate-200/50 pb-3">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">Driver Status</span>
                    <span class="text-xs font-black text-indigo-600">On-Route</span>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 shadow-inner"><i class="fa-solid fa-user"></i></div>
                    <div>
                        <p class="font-bold text-slate-800 text-sm">John Doe</p>
                        <p class="text-[10px] font-medium text-slate-500">Shuttle 1 (Campus Route)</p>
                    </div>
                </div>
            </div>

            <form class="bg-white/60 p-5 rounded-2xl border border-white shadow-sm flex-1 flex flex-col">
                <h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Direct Dispatch</h4>
                <div class="space-y-4 flex-1">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Assign Task</label>
                        <select class="modern-input py-2.5 font-medium bg-white/90">
                            <option>Standard Campus Run</option>
                            <option>Mall Trip (Weekend)</option>
                            <option>Emergency Pickup</option>
                            <option>Custom Route</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Message</label>
                        <textarea rows="3" class="modern-input resize-none font-medium text-slate-700 bg-white/90" placeholder="Dispatch notes..."></textarea>
                    </div>
                </div>
                <button type="button" onclick="showToast('Dispatch logged successfully (Frontend Demo Only)')" class="w-full mt-4 bg-indigo-500 hover:bg-indigo-600 text-white font-bold text-sm rounded-xl py-3 shadow-md shadow-indigo-500/20 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-walkie-talkie"></i> Send Dispatch
                </button>
            </form>
        </div>
    </div>
</div>
