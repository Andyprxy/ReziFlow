<div class="glass-panel rounded-[24px] lg:rounded-[32px] p-6 lg:p-10 max-w-7xl mx-auto relative overflow-hidden animate-[paneFade_0.4s_cubic-bezier(0.16,1,0.3,1)_forwards]">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-8 border-b border-slate-200/60 pb-6 gap-4">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-blue-400 text-white flex items-center justify-center text-xl shadow-md shadow-indigo-500/20"><i class="fa-solid fa-van-shuttle"></i></div>
            <div>
                <h2 class="text-xl sm:text-2xl font-black text-slate-800 tracking-tight">Transport Operations</h2>
                <p class="text-xs text-slate-500 font-medium">Live fleet tracking and dispatch center</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span id="fleet-status-badge" class="bg-amber-50 text-amber-600 text-[10px] font-bold px-3 py-1.5 rounded-full border border-amber-100 flex items-center gap-1.5 shadow-sm"><i class="fa-solid fa-circle-notch fa-spin"></i> Awaiting Signal</span>
            <button onclick="fetchFleetLocation()" class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-600 font-bold w-9 h-9 rounded-xl transition-all shadow-sm flex items-center justify-center text-sm" title="Force Sync"><i class="fa-solid fa-rotate text-indigo-500"></i></button>
        </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-8 h-[600px]">
        <div class="lg:col-span-2 relative rounded-[24px] overflow-hidden border border-white shadow-inner bg-slate-100 flex flex-col z-10">
            <div id="admin-fleet-map" class="w-full h-full z-10 relative"></div>
            <div id="map-loading-overlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-20 flex flex-col items-center justify-center transition-opacity duration-300">
                <div class="w-16 h-16 rounded-full bg-indigo-50 text-indigo-500 flex items-center justify-center text-3xl shadow-sm mb-4 border border-indigo-100"><i class="fa-solid fa-satellite-dish animate-pulse"></i></div>
                <span class="text-xs font-bold text-slate-700 tracking-widest uppercase">Connecting to Fleet...</span>
            </div>
            <div class="absolute bottom-6 left-6 z-[400] bg-white/90 backdrop-blur-md p-4 rounded-2xl shadow-lg border border-white max-w-xs transition-transform transform translate-y-0">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Active Unit</span>
                    <span class="bg-emerald-100 text-emerald-700 text-[9px] px-2 py-0.5 rounded font-bold uppercase tracking-wider shadow-sm">On Route</span>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-500 shadow-inner"><i class="fa-solid fa-user-astronaut text-lg"></i></div>
                    <div>
                        <p class="font-black text-slate-800 text-sm">Shuttle 01</p>
                        <p class="text-[10px] font-semibold text-slate-500 font-mono" id="shuttle-last-updated">Last ping: --</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex flex-col gap-5 h-full">
            <div class="glass-segmented w-full flex-shrink-0">
                <button onclick="toggleTransportView('inbox')" id="btn-trans-inbox" class="glass-seg-btn active accent-blue flex-1 justify-center py-2 text-xs"><i class="fa-solid fa-inbox"></i> Student Requests</button>
                <button onclick="toggleTransportView('dispatch')" id="btn-trans-dispatch" class="glass-seg-btn accent-indigo flex-1 justify-center py-2 text-xs"><i class="fa-solid fa-walkie-talkie"></i> Direct Dispatch</button>
            </div>
            <div id="transport-view-inbox" class="flex-1 flex flex-col min-h-0 bg-white/40 rounded-[24px] border border-white shadow-sm overflow-hidden">
                <div class="p-4 border-b border-white/60 flex justify-between items-center bg-white/50 backdrop-blur-md flex-shrink-0">
                    <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Incoming Feed</h3>
                    <span class="bg-blue-50 text-blue-600 px-2.5 py-0.5 rounded-full text-[10px] font-bold border border-blue-100 shadow-sm" id="transport-inbox-count">2 Pending</span>
                </div>
                <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-3" id="transport-inbox-feed">
                    <div class="bg-white border border-slate-200 rounded-[16px] p-4 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group">
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-amber-400"></div>
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-[10px] font-bold"><i class="fa-solid fa-user"></i></div>
                                <span class="text-xs font-black text-slate-800">221227336</span>
                            </div>
                            <span class="text-[9px] font-mono text-slate-400 font-bold">14:02</span>
                        </div>
                        <p class="text-[11px] text-slate-600 font-medium mb-3 italic">"Pickup requested at Campus Main Gate. Will be waiting."</p>
                        <div class="flex gap-2">
                            <button onclick="forwardToDriver('REQ-001')" class="flex-1 bg-[#1d1d1f] hover:bg-indigo-600 text-white text-[10px] font-bold py-2 rounded-xl transition-colors shadow-sm">Forward to Driver</button>
                            <button onclick="dismissRequest(this)" class="w-8 flex-shrink-0 bg-slate-50 border border-slate-200 text-slate-400 hover:bg-rose-50 hover:text-rose-500 hover:border-rose-200 rounded-xl transition-colors flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="transport-view-dispatch" class="hidden flex-1 flex-col min-h-0 bg-white/60 p-5 rounded-[24px] border border-white shadow-sm overflow-y-auto custom-scroll relative">
                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">Master Override</h3>
                <form class="space-y-4 flex-1 flex flex-col" onsubmit="sendDispatchToDriver(event)">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Priority Level</label>
                        <div class="glass-segmented w-full">
                            <button type="button" onclick="setDispatchPriority('normal')" id="btn-pri-normal" class="glass-seg-btn active accent-blue flex-1 justify-center py-1.5 text-[10px]">Normal</button>
                            <button type="button" onclick="setDispatchPriority('urgent')" id="btn-pri-urgent" class="glass-seg-btn accent-rose flex-1 justify-center py-1.5 text-[10px]">Urgent</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Route Instruction</label>
                        <select id="dispatch-route" class="modern-input py-2.5 font-medium bg-white/90 text-sm">
                            <option value="Standard Campus Run">Standard Campus Run</option>
                            <option value="Mall Trip (Weekend)">Mall Trip (Weekend)</option>
                            <option value="Emergency Pickup">Emergency Pickup</option>
                            <option value="Custom Route">Custom Route</option>
                        </select>
                    </div>
                    <div class="flex-1 flex flex-col">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Message Payload</label>
                        <textarea id="dispatch-message" class="modern-input resize-none font-medium text-slate-700 bg-white/90 h-full min-h-[100px] flex-1" placeholder="Type instructions to push directly to Shuttle 01 console..."></textarea>
                    </div>
                    <button type="submit" id="btn-send-dispatch" class="w-full mt-2 bg-indigo-500 hover:bg-indigo-600 text-white font-bold text-sm rounded-xl py-3.5 shadow-md shadow-indigo-500/20 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-satellite-dish"></i> Transmit to Driver
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
