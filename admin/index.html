<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ReziFlow OS | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f7; color: #1d1d1f; -webkit-font-smoothing: antialiased; }
        /* Keep your existing CSS exactly as it was... */
    </style>
</head>
<body class="flex flex-col lg:flex-row min-h-screen overflow-hidden relative">

    <div class="fixed top-[-15%] left-[-10%] w-[60%] h-[60%] bg-blue-300 rounded-full mix-blend-multiply filter blur-[140px] opacity-[0.25] z-0 pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-emerald-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-[0.25] z-0 pointer-events-none"></div>

    <div id="toast-container" class="fixed top-6 left-0 right-0 z-[2000] flex justify-center px-4 pointer-events-none">
        <div id="toast-message" class="bg-[#1d1d1f] text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 font-medium text-sm">
            <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toast-text">Action completed successfully.</span>
        </div>
    </div>

    <div class="lg:hidden flex items-center justify-between p-4 bg-white/80 backdrop-blur-2xl border-b border-slate-200 z-50 sticky top-0">
        <div class="flex items-center gap-2"><i class="fa-solid fa-layer-group text-blue-600 text-xl"></i><span class="font-black text-xl tracking-tight text-slate-800">Rezi<span class="text-blue-500">Flow</span></span></div>
        <button onclick="toggleSidebar()" class="w-10 h-10 rounded-full bg-white shadow-sm border border-slate-200 flex items-center justify-center text-slate-600"><i class="fa-solid fa-bars"></i></button>
    </div>

    <aside id="sidebar" class="fixed lg:relative inset-y-0 left-0 transform -translate-x-full lg:translate-x-0 transition-transform duration-400 ease-in-out z-[100] lg:z-20 w-72 lg:w-64 xl:w-72 bg-white/40 lg:bg-gradient-to-b lg:from-slate-200/70 lg:to-slate-300/40 backdrop-blur-3xl border-r border-white/60 flex flex-col justify-between shadow-[20px_0_40px_rgba(0,0,0,0.02)] h-full flex-shrink-0">
        <button onclick="toggleSidebar()" class="lg:hidden absolute top-4 right-4 w-8 h-8 rounded-full bg-white flex items-center justify-center text-slate-500"><i class="fa-solid fa-xmark"></i></button>

        <div class="overflow-y-auto custom-scroll flex-1 px-4 py-6">
            <div class="hidden lg:flex items-center gap-3 bg-white/70 backdrop-blur-md p-4 rounded-[24px] border border-white shadow-sm mb-8">
                <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-teal-400 rounded-2xl flex items-center justify-center text-white"><i class="fa-solid fa-layer-group text-xl"></i></div>
                <div class="flex flex-col">
                    <span class="font-black text-2xl tracking-tight text-slate-800 leading-none">Rezi<span class="text-blue-500">Flow</span></span>
                    <span class="text-[9px] font-bold tracking-widest text-slate-500 uppercase mt-1">Command Center</span>
                </div>
            </div>

            <nav class="space-y-6">
                <div class="bg-white/50 backdrop-blur-md border border-white/80 shadow-sm p-2 rounded-[24px]">
                    <p class="px-4 text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-2 mt-1">Core Engines</p>
                    <div class="space-y-1">
                        <button onclick="loadEngine('vetting', 'Student Hub', 'Automated POPIA Database Sync', this)" id="nav-vetting" class="nav-tab-btn active-tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-[16px] text-sm font-medium"><i class="fa-solid fa-users text-lg w-5 text-center"></i> Student Hub</button>
                        <button onclick="loadEngine('occupancy', 'Occupancy', 'Live Occupancy Overview', this)" class="nav-tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-[16px] text-sm font-medium text-slate-600"><i class="fa-solid fa-chart-pie text-lg w-5 text-center"></i> Occupancy</button>
                        <button onclick="loadEngine('finance', 'Finance', 'Automated Ledger Reconciliation', this)" class="nav-tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-[16px] text-sm font-medium text-slate-600"><i class="fa-solid fa-wallet text-lg w-5 text-center"></i> Finance</button>
                    </div>
                </div>
                </nav>
        </div>
    </aside>

    <div id="mobile-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-40 hidden lg:hidden opacity-0"></div>

    <div class="flex-1 flex flex-col lg:flex-row min-w-0 h-[calc(100vh-72px)] lg:h-screen relative z-10 overflow-hidden">
        <div class="flex-1 flex flex-col overflow-hidden min-w-0 transition-all duration-300">
            
            <header class="h-20 lg:h-24 bg-transparent flex items-center justify-between px-4 sm:px-6 lg:px-10 flex-shrink-0">
                <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-3 lg:gap-4">
                    <h1 id="matrixTitle" class="text-xl sm:text-2xl lg:text-3xl font-black tracking-tight text-slate-800">Student Hub</h1>
                    <div class="h-6 w-px bg-slate-300 hidden sm:block"></div>
                    <p id="matrixSub" class="text-[10px] sm:text-xs lg:text-sm text-slate-500 font-medium sm:pt-1">Automated POPIA Database Sync</p>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto px-4 lg:px-10 pb-24 custom-scroll min-w-0 relative">
                
                <div id="pane-vetting" class="block space-y-6 lg:space-y-8">
                    </div>

                <div id="dynamic-pane" class="hidden space-y-6 lg:space-y-8"></div>

            </main>
        </div>

        <aside id="telemetry-sidebar" class="telemetry-collapsed hidden lg:flex w-64 xl:w-[280px] relative flex-col z-20 flex-shrink-0 bg-white/50 backdrop-blur-2xl border-l border-white/80 h-full overflow-hidden transition-all duration-300 ease-in-out">
            <div class="p-5 xl:p-6 pb-4 flex items-center justify-between border-b border-white/60 flex-shrink-0">
                <h3 class="font-black text-base xl:text-lg tracking-tight text-slate-800">Live Telemetry</h3>
                <div class="bg-white text-blue-600 border border-slate-100 font-bold text-[10px] uppercase tracking-wider px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm flex-shrink-0"><div class="w-1.5 h-1.5 bg-emerald-500 rounded-full shadow-[0_0_6px_rgba(16,185,129,0.5)] animate-pulse"></div> Active</div>
            </div>
            <div class="flex-1 space-y-4 overflow-y-auto custom-scroll p-4 xl:p-6 font-mono text-xs leading-relaxed" id="telemetry-feed">
                </div>
        </aside>
    </div>

    <script>
        // GLOBAL UTILITIES (Keep these in the shell)
        const loadedModules = new Set();
        let globalStudentData = []; 

        document.addEventListener('DOMContentLoaded', () => {
            // Load Default Hub Data
            if (typeof fetchDatabaseData === 'function') fetchDatabaseData(false);
        });

        function toggleSidebar() { /* Your existing function */ }
        function showToast(message, type = 'success') { /* Your existing function */ }
        function parseN8n(d) { /* Your existing Ghost Filter function */ }
        function addTelemetryLog(system, status, message) { /* Your existing function */ }

        // ==========================================
        // DYNAMIC ROUTING ENGINE (NEW)
        // ==========================================
        async function loadEngine(engineId, title, subTitle, btnElement) {
            // 1. Manage Active UI State
            document.querySelectorAll('.nav-tab-btn').forEach(btn => {
                btn.className = "nav-tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-[16px] text-sm font-medium text-slate-600 border border-transparent transition-all";
            });
            btnElement.className = "nav-tab-btn active-tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-[16px] text-sm font-bold transition-all bg-white shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-white text-blue-600 transform scale-[1.02]";
            
            document.getElementById('matrixTitle').textContent = title;
            document.getElementById('matrixSub').textContent = subTitle;
            if (window.innerWidth < 1024) toggleSidebar();

            const vettingPane = document.getElementById('pane-vetting');
            const dynamicPane = document.getElementById('dynamic-pane');

            // 2. If returning to default Hub, hide dynamic pane and show Hub
            if (engineId === 'vetting') {
                dynamicPane.style.display = 'none';
                vettingPane.style.display = 'block';
                return;
            }

            // 3. Prepare Dynamic Pane
            vettingPane.style.display = 'none';
            dynamicPane.style.display = 'block';
            dynamicPane.innerHTML = '<div class="flex justify-center py-20"><i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-600"></i></div>';

            try {
                // Fetch the specific HTML fragment
                const response = await fetch(`pages/${engineId}.html`);
                if (!response.ok) throw new Error(`HTML fragment ${engineId} not found.`);
                const html = await response.text();
                dynamicPane.innerHTML = html;

                // Load the specific JS logic if it hasn't been loaded yet
                if (!loadedModules.has(engineId)) {
                    const script = document.createElement('script');
                    script.src = `js/${engineId}.js`;
                    document.body.appendChild(script);
                    loadedModules.add(engineId);
                } else {
                    // If previously loaded, re-trigger its initialization function
                    if (typeof window[`init_${engineId}`] === 'function') {
                        window[`init_${engineId}`]();
                    }
                }
            } catch (error) {
                dynamicPane.innerHTML = `<div class="p-8 text-center text-rose-500 font-bold bg-white/50 rounded-2xl border border-rose-100">Failed to load ${title} engine. Ensure pages/${engineId}.html exists.</div>`;
                console.error(error);
            }
        }

        // Include ALL your Student Hub specific Javascript here (fetchDatabaseData, renderUI, setFilter, processApproval, etc.)
        // This ensures the default tab functions normally.
    </script>
</body>
</html>
