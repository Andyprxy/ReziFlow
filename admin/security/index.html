<div class="glass-panel rounded-[24px] lg:rounded-[32px] overflow-hidden border border-rose-100/50 shadow-[0_0_40px_rgba(225,29,72,0.03)] animate-[paneFade_0.4s_cubic-bezier(0.16,1,0.3,1)_forwards]">
    <div class="px-4 sm:px-6 lg:px-8 py-5 border-b border-white/60 flex flex-col md:flex-row gap-4 justify-between md:items-center bg-white/50 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center shadow-sm"><i class="fa-solid fa-shield-halved text-sm"></i></div>
            <h3 class="font-bold text-slate-800 text-base sm:text-lg">Live Security Feeds</h3>
        </div>
        <div class="flex items-center gap-3 flex-wrap md:flex-nowrap justify-end">
            <div class="glass-segmented">
                <button onclick="setSecurityStatus('all')" id="sec-stat-all" class="glass-seg-btn active accent-rose">All Alerts</button>
                <button onclick="setSecurityStatus('open')" id="sec-stat-open" class="glass-seg-btn accent-rose">Active</button>
                <button onclick="setSecurityStatus('closed')" id="sec-stat-closed" class="glass-seg-btn accent-rose">Cleared</button>
            </div>
            <div class="relative w-full sm:w-48">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="search-security" onkeyup="filterTable('search-security', 'security-body')" placeholder="Search alerts..." class="modern-input search-input py-2 bg-white/80">
            </div>
            <button onclick="downloadReport('security')" class="bg-[#1d1d1f] hover:bg-[#333336] text-white font-bold px-4 py-2 rounded-xl transition-all shadow-md flex items-center gap-1.5 flex-shrink-0 text-sm"><i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Report</span></button>
            <button onclick="fetchSecurityData(true)" class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-600 font-bold px-4 py-2 rounded-xl transition-all shadow-sm flex items-center gap-1.5 flex-shrink-0 text-sm"><i class="fa-solid fa-rotate text-blue-500"></i></button>
        </div>
    </div>
    <div class="overflow-x-auto custom-scroll bg-white/30 backdrop-blur-sm">
        <table class="w-full text-left text-sm border-collapse min-w-[700px]">
            <thead>
                <tr class="bg-white/40 text-slate-400 uppercase tracking-widest font-bold text-[10px] border-b border-slate-200/50">
                    <th class="p-4 sm:p-6">Timestamp</th>
                    <th class="p-4 sm:p-6">Resident & Room</th>
                    <th class="p-4 sm:p-6">Alert Level</th>
                    <th class="p-4 sm:p-6">Details</th>
                    <th class="p-4 sm:p-6 text-right">Dispatch Action</th>
                </tr>
            </thead>
            <tbody id="security-body" class="divide-y divide-slate-100/50"></tbody>
        </table>
    </div>
</div>
