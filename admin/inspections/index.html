<style>
    /* ---------------------------------------------------
       FLUID COMPACT LAYOUT & SIDEBAR CONFIG
       --------------------------------------------------- */
    .glass-segmented {
        background: rgba(230, 230, 235, 0.45); backdrop-filter: blur(20px); border-radius: 12px; padding: 3px; 
        border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: inset 0 1px 4px rgba(0,0,0,0.03); 
        display: inline-flex; flex-wrap: wrap; gap: 3px; align-items: center;
    }
    
    .glass-seg-btn {
        padding: 4px 10px; font-size: 0.65rem; font-weight: 700; color: #64748b; border-radius: 8px; 
        transition: all 0.2s ease; cursor: pointer; display: flex; align-items: center; gap: 4px; border: 1px solid transparent;
    }
    @media (min-width: 640px) { .glass-seg-btn { padding: 6px 12px; font-size: 0.7rem; gap: 6px; border-radius: 10px; } }
    .glass-seg-btn:hover:not(.active) { background: rgba(255, 255, 255, 0.4); color: #334155; }
    .glass-seg-btn.active {
        background: rgba(255, 255, 255, 0.95); color: #1d1d1f; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border: 1px solid rgba(255, 255, 255, 1);
    }
    .glass-seg-btn.active.accent-blue { color: #0071e3; } 
    .glass-seg-btn.active.accent-emerald { color: #10b981; }
    .glass-seg-btn.active.accent-amber { color: #f59e0b; }

    /* Right Sidebar (Collapsed by default, 10% Shrink) */
    .hub-sidebar { width: 22%; max-width: 224px; min-width: 150px; flex-shrink: 0; display: flex; flex-direction: column; gap: 0.75rem; transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), min-width 0.4s; position: relative; }
    .hub-sidebar.collapsed { width: 48px !important; min-width: 48px !important; }
    .hub-sidebar.collapsed .nav-text { display: none !important; }

    .hub-sidebar.collapsed .block-btn { padding: 10px 0 !important; justify-content: center !important; }

    .nav-block { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 1); box-shadow: 0 4px 20px -10px rgba(0,0,0,0.05); border-radius: 14px; padding: 8px; transition: all 0.3s ease; }
    .block-btn { width: 100%; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; font-size: 0.65rem; font-weight: 700; transition: all 0.2s ease; cursor: pointer; white-space: nowrap; overflow: hidden; }
    .block-btn-inactive { background-color: transparent; color: #64748b; }
    .block-btn-inactive:hover { background-color: rgba(255,255,255,0.6); color: #334155; }
    
    /* Compact Table Constraints */
    .compact-table th { padding: 8px 10px; font-size: 0.55rem; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 800; color: #94a3b8; border-bottom: 1px solid rgba(226, 232, 240, 0.5); }
    .compact-table td { padding: 6px 10px; border-bottom: 1px solid rgba(226, 232, 240, 0.4); vertical-align: middle; font-size: 0.68rem; }
    .glass-panel { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); border-radius: 20px; }
    
    /* High-End Modals */
    .modal-overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; background: rgba(29, 29, 31, 0.4); backdrop-filter: blur(12px); z-index: 3000; display: flex; align-items: center; justify-content: center; position: fixed; inset: 0; padding: 1rem; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { transform: scale(0.95) translateY(20px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1); background: #ffffff; border-radius: 24px; padding: 1.25rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); max-height: 90vh; overflow-y: auto; }
    .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }

    .magic-border-container { position: relative; padding: 2px; border-radius: 26px; overflow: hidden; background: transparent; }
    .magic-border-container::before { content: ''; position: absolute; top: 50%; left: 50%; width: 200%; height: 200%; background: conic-gradient(from 0deg, transparent 40%, rgba(20, 184, 166, 0.2) 60%, #14b8a6 80%, #0d9488 100%); transform-origin: 0 0; animation: magic-spin 3s linear infinite; z-index: 0; }
    @keyframes magic-spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    .magic-border-inner { position: relative; z-index: 10; background: #ffffff; border-radius: 24px; width: 100%; height: 100%; padding: 1.25rem; }
</style>

<script>
    // ----------------------------------------------------
    // ARCHITECTURAL DATA PIPELINE FALLBACK
    // ----------------------------------------------------
    (async function initInspectionsCheck() {
        if (typeof window.globalStudentData === 'undefined' || window.globalStudentData.length === 0) {
            try {
                const response = await fetch('https://n8n.automania.cloud/webhook/reziflow-admin-data');
                if (response.ok) { window.globalStudentData = window.parseN8n(await response.json()); }
            } catch (e) { }
        }
        if (typeof window.globalInspectionsData === 'undefined' || window.globalInspectionsData.length === 0) {
            try {
                const response = await fetch('https://n8n.automania.cloud/webhook/reziflow-get-inspections');
                if (response.ok) { window.globalInspectionsData = window.parseN8n(await response.json()); }
            } catch (e) { }
        }
        window.renderInspectionsData();
    })();

    // ----------------------------------------------------
    // LOCAL CONFIGURATION VARS
    // ----------------------------------------------------
    var currentInspectionFilter = 'all';

    window.toggleInspSidebar = function() {
        const sidebar = document.getElementById('insp-right-sidebar');
        if(sidebar) {
            sidebar.classList.toggle('collapsed');
            const icon = document.getElementById('insp-sidebar-toggle-icon');
            if(icon) {
                if(sidebar.classList.contains('collapsed')) { icon.className = "fa-solid fa-chevron-left text-slate-300 text-[8px] pr-1"; } 
                else { icon.className = "fa-solid fa-chevron-right text-slate-300 text-[8px] pr-1"; }
            }
        }
    };

    if (window.innerWidth < 768) { window.toggleInspSidebar(); }

    function updateSegmentedActive(pfx, val, opts) { 
        opts.forEach(o => { const el = document.getElementById(`${pfx}-${o}`); if(el) el.classList.remove('active', 'accent-blue', 'accent-emerald', 'accent-amber'); }); 
        const aEl = document.getElementById(`${pfx}-${val}`); 
        if(aEl) { 
            aEl.classList.add('active'); 
            if(val === 'clean') aEl.classList.add('accent-emerald'); 
            else if(val === 'issues') aEl.classList.add('accent-amber');
            else aEl.classList.add('accent-blue');
        } 
    }

    // ----------------------------------------------------
    // RENDERING LOGIC MATRIX
    // ----------------------------------------------------
    window.setInspectionFilter = function(filter) {
        currentInspectionFilter = filter;
        updateSegmentedActive('insp-btn', filter, ['all', 'issues', 'clean']);
        window.renderInspectionsData();
    };

    window.fetchInspectionsData = async function(forcedRefresh = true) {
        const body = document.getElementById('inspections-body');
        if (forcedRefresh && body) { body.innerHTML = '<tr><td colspan="4" class="p-8 text-center"><i class="fa-solid fa-circle-notch fa-spin text-teal-500 text-2xl"></i></td></tr>'; }
        
        try { 
            const response = await fetch('https://n8n.automania.cloud/webhook/reziflow-get-inspections'); 
            if (response.ok) { window.globalInspectionsData = window.parseN8n(await response.json()); }
        } catch (e) { } 
        finally { window.renderInspectionsData(); }
    };

    window.renderInspectionsData = function() {
        const body = document.getElementById('inspections-body'); if(!body) return;
        let baseData = window.globalInspectionsData || [];

        if (baseData.length === 0) { body.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400 font-bold text-[10px]">No inspections logged yet.</td></tr>`; return; }

        let allCount = 0; let cleanCount = 0; let issueCount = 0;

        // Process parsing and stats
        const parsedData = baseData.map(log => {
            const rawList = String(log.Checklist_Data || log.Issues || '');
            const issuesFound = (rawList.match(/Damaged/gi) || []).length + (rawList.match(/Missing/gi) || []).length;
            
            allCount++;
            if (issuesFound > 0) issueCount++; else cleanCount++;
            
            return { ...log, issuesFound, rawList };
        });

        if(document.getElementById('kpi-insp-all')) document.getElementById('kpi-insp-all').textContent = allCount;
        if(document.getElementById('kpi-insp-clean')) document.getElementById('kpi-insp-clean').textContent = cleanCount;
        if(document.getElementById('kpi-insp-issues')) document.getElementById('kpi-insp-issues').textContent = issueCount;

        // Apply Status Filter
        let filteredData = parsedData;
        if (currentInspectionFilter === 'clean') filteredData = parsedData.filter(d => d.issuesFound === 0);
        else if (currentInspectionFilter === 'issues') filteredData = parsedData.filter(d => d.issuesFound > 0);

        if (filteredData.length === 0) { body.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400 font-bold text-[10px]">No records match current filter.</td></tr>`; return; }

        // Sort latest first
        filteredData.sort((a, b) => new Date(b.Timestamp || 0).getTime() - new Date(a.Timestamp || 0).getTime());

        let htmlStr = '';
        filteredData.forEach(log => {
            const student = (window.globalStudentData || []).find(s => s.Student_Number === log.Student_Number);
            const residentName = student ? `${student.First_Name || ''} ${student.Surname || ''}`.trim() : 'Unknown Resident';
            let roomNo = log.Room_Allocation || log.Room; 
            if (!roomNo || roomNo === 'TEST-01' || roomNo === '--') roomNo = student ? (student.Room_Allocation || 'Unassigned') : 'Unassigned';
            
            let statusBadge = log.issuesFound > 0 
                ? `<span class="bg-white border border-amber-200 shadow-sm text-amber-600 px-2.5 py-1 rounded text-[8px] font-bold uppercase tracking-wider animate-pulse inline-flex items-center gap-1"><i class="fa-solid fa-triangle-exclamation"></i> ${log.issuesFound} Issues</span>` 
                : `<span class="bg-emerald-50 border border-emerald-100 shadow-sm text-emerald-600 px-2.5 py-1 rounded text-[8px] font-bold uppercase tracking-wider inline-flex items-center gap-1"><i class="fa-solid fa-check"></i> Verified Clean</span>`;

            // Setup Escalation Vars
            const safeId = String(log.Student_Number || '').replace(/'/g, "\\'");
            const safeRoom = String(roomNo || '').replace(/'/g, "\\'");
            const safeDesc = String(log.rawList || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");

            const actionBtn = log.issuesFound > 0 
                ? `<button onclick="window.openEscalationModal('${safeId}', '${safeRoom}', '${safeDesc}')" class="bg-white border border-indigo-200 hover:bg-indigo-50 text-indigo-600 text-[8px] font-bold px-2.5 py-1.5 rounded-lg transition-all shadow-sm flex items-center gap-1.5"><i class="fa-solid fa-screwdriver-wrench"></i> Escalate to Ops</button>`
                : `<span class="text-[8px] font-bold text-slate-400 border border-dashed border-slate-300 bg-white/50 px-2.5 py-1.5 rounded-lg">No Action Needed</span>`;

            htmlStr += `
                <tr class="${log.issuesFound > 0 ? 'bg-amber-50/20' : 'hover:bg-white/80'} transition-colors border-b border-slate-100/50">
                    <td class="align-top"><div class="text-[10px] font-medium text-slate-500 whitespace-nowrap">${log.Timestamp ? log.Timestamp.split('T')[0] : '--'}</div><div class="text-[8px] text-slate-400 mt-0.5">${log.Timestamp ? log.Timestamp.split('T')[1]?.split('.')[0] || '' : ''}</div></td>
                    <td class="align-top"><div class="font-black text-slate-800 text-[11px]">${residentName}</div><div class="text-[9px] font-bold text-slate-500 mt-1 flex items-center gap-1.5"><i class="fa-solid fa-bed text-blue-400"></i> ${roomNo} <span class="text-slate-300 ml-1 font-mono">${log.Student_Number || '--'}</span></div></td>
                    <td class="align-top"><div class="mb-1.5">${statusBadge}</div><div class="text-[9px] text-slate-600 font-mono leading-relaxed max-w-[200px] sm:max-w-sm line-clamp-2 hover:line-clamp-none transition-all cursor-pointer bg-white/50 p-1.5 rounded border border-slate-100">${log.rawList || 'All clear.'}</div></td>
                    <td class="text-right align-top"><div class="flex flex-col items-end gap-2 text-[9px] text-slate-500 italic truncate max-w-[120px]">${log.Notes && log.Notes !== 'None' ? `"${log.Notes}"` : ''} ${actionBtn}</div></td>
                </tr>`;
        });
        body.innerHTML = htmlStr;
    };

    // ----------------------------------------------------
    // ESCALATION & MANUAL LOGGING MODALS
    // ----------------------------------------------------
    window.openEscalationModal = function(studentId, room, description) {
        document.getElementById('esc-student-id').value = studentId;
        document.getElementById('esc-room').value = room;
        
        // Clean up description for the textarea
        const cleanDesc = description.replace(/Missing /g, "Missing: ").replace(/Damaged /g, "Damaged: ");
        document.getElementById('esc-desc').value = `Inspection flagged the following issues upon move-in: ${cleanDesc}`;
        
        document.getElementById('escalateTicketModal').classList.add('active');
    };

    window.submitEscalation = async function(e) {
        e.preventDefault(); const btn = document.getElementById('btn-submit-esc'); const ogHtml = btn.innerHTML;
        const payload = {
            Student_Number: document.getElementById('esc-student-id').value,
            Room: document.getElementById('esc-room').value,
            Category: document.getElementById('esc-category').value,
            Description: document.getElementById('esc-desc').value,
            Ticket_Source: "Inspection Escalation"
        };
        
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Routing...'; btn.disabled = true;
        try {
            await fetch('https://n8n.automania.cloud/webhook/reziflow-log-snag', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            document.getElementById('escalateTicketModal').classList.remove('active');
            window.showToast("Routed to Maintenance successfully.");
        } catch(err) { window.showToast("Network Error", "error"); } finally { btn.innerHTML = ogHtml; btn.disabled = false; }
    };

    window.submitManualInspection = async function(e) {
        e.preventDefault(); const btn = document.getElementById('btn-submit-man-insp'); const ogHtml = btn.innerHTML;
        const payload = {
            Student_Number: document.getElementById('man-insp-id').value,
            Room_Allocation: document.getElementById('man-insp-room').value, // Mimic n8n structure
            Checklist_Data: document.getElementById('man-insp-issues').value || 'Clean',
            Notes: document.getElementById('man-insp-notes').value || 'None',
            Timestamp: new Date().toISOString()
        };
        
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Pushing...'; btn.disabled = true;
        try {
            // Use your inspection webhook if it exists, otherwise pseudo-log it locally for demo
            // await fetch('https://n8n.automania.cloud/webhook/reziflow-log-inspection', { method: 'POST', body: JSON.stringify(payload) });
            
            // Pseudo-Push to active array for immediate visual feedback
            if(!window.globalInspectionsData) window.globalInspectionsData = [];
            window.globalInspectionsData.unshift(payload);
            window.renderInspectionsData();
            
            document.getElementById('manualInspectionModal').classList.remove('active');
            e.target.reset();
            window.showToast("Inspection securely logged.");
        } catch(err) { window.showToast("Network Error", "error"); } finally { btn.innerHTML = ogHtml; btn.disabled = false; }
    };

    window.downloadInspectionsReport = function() {
        const searchVal = document.getElementById('search-inspections')?.value.toLowerCase() || '';
        let csvContent = "data:text/csv;charset=utf-8,";
        let filename = `ReziFlow_Inspections_Ledger`;

        csvContent += "Timestamp,Student Number,Resident Name,Room,Issues Found,Checklist Data,Notes\n";
        
        let baseData = window.globalInspectionsData || [];
        
        let filteredData = baseData.map(log => {
            const rawList = String(log.Checklist_Data || log.Issues || '');
            const issuesFound = (rawList.match(/Damaged/gi) || []).length + (rawList.match(/Missing/gi) || []).length;
            return { ...log, issuesFound, rawList };
        });

        if (currentInspectionFilter === 'clean') filteredData = filteredData.filter(d => d.issuesFound === 0);
        else if (currentInspectionFilter === 'issues') filteredData = filteredData.filter(d => d.issuesFound > 0);

        filteredData = filteredData.filter(s => JSON.stringify(s).toLowerCase().includes(searchVal));

        if(filteredData.length === 0) return window.showToast("No data to export.", "error");

        filteredData.forEach(log => {
            const student = (window.globalStudentData || []).find(s => s.Student_Number === log.Student_Number);
            const residentName = student ? `${student.First_Name || ''} ${student.Surname || ''}`.trim() : 'Unknown';
            let roomNo = log.Room_Allocation || log.Room; 
            if (!roomNo || roomNo === 'TEST-01' || roomNo === '--') roomNo = student ? (student.Room_Allocation || 'Unassigned') : 'Unassigned';
            
            // Clean up commas in data to prevent CSV column breaking
            const cleanChecklist = String(log.rawList).replace(/"/g, '""');
            const cleanNotes = String(log.Notes || '').replace(/"/g, '""');
            
            csvContent += `"${log.Timestamp || ''}","${log.Student_Number || ''}","${residentName}","${roomNo}","${log.issuesFound}","${cleanChecklist}","${cleanNotes}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a"); link.setAttribute("href", encodedUri); link.setAttribute("download", `${filename}_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    };
</script>
