<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReziFlow | Live Shuttle Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet Map Integration -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f4f7fb; }
        
        .liquid-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 40px -10px rgba(0,0,0,0.05);
        }

        #map { width: 100%; height: 450px; border-radius: 20px; z-index: 10; }
        
        /* Custom Glowing Map Marker */
        .live-marker {
            background: #06b6d4;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.8);
            transition: all 1s ease-in-out;
        }
        
        /* Pulse effect behind the marker */
        .live-marker::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            border: 2px solid #06b6d4;
            animation: radar 2s infinite ease-out;
        }
        
        @keyframes radar {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }
    </style>
</head>
<body class="p-4 lg:p-10">

    <div class="max-w-4xl mx-auto liquid-glass rounded-[32px] p-6 lg:p-8">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-6 pb-6 border-b border-slate-200">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-gradient-to-br from-cyan-400 to-blue-500 text-white rounded-2xl flex items-center justify-center text-xl shadow-lg shadow-cyan-500/30">
                    <i class="fa-solid fa-location-crosshairs"></i>
                </div>
                <div>
                    <h2 class="text-xl font-black text-slate-800 tracking-tight">Campus Shuttle</h2>
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1 flex items-center gap-1.5">
                        <span class="w-2 h-2 inline-block bg-emerald-500 rounded-full animate-pulse"></span> Live GPS Tracking
                    </p>
                </div>
            </div>
            <div class="px-5 py-2.5 bg-slate-900 text-white text-xs font-bold rounded-xl shadow-md flex items-center gap-2">
                <i class="fa-solid fa-clock text-cyan-400"></i> ETA: ~4 Mins
            </div>
        </div>

        <!-- Map Container -->
        <div class="p-2 bg-white border border-slate-200 rounded-[24px] shadow-sm">
            <div id="map"></div>
        </div>
        
        <div class="mt-6 flex justify-between items-center px-2">
            <div class="flex items-center gap-2 text-xs font-bold text-slate-500">
                <i class="fa-solid fa-circle-info text-blue-500"></i> Auto-refreshing every 5s
            </div>
            <div class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">
                Engineered by Automania
            </div>
        </div>
    </div>

    <script>
        // Initialize Map (Centered on TUT Pretoria coordinates)
        const map = L.map('map').setView([-25.7479, 28.2293], 15);

        // Load premium light-themed map tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap & Carto',
            maxZoom: 19
        }).addTo(map);

        // Define the Custom ReziFlow Marker
        const shuttleIcon = L.divIcon({
            className: 'live-marker',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        let shuttleMarker = null;

        // Fetch location from n8n
        async function fetchDriverLocation() {
            try {
                const response = await fetch('https://n8n.automania.cloud/webhook/reziflow-get-shuttle');
                const data = await response.json();
                
                if (data.Latitude && data.Longitude) {
                    const lat = parseFloat(data.Latitude);
                    const lng = parseFloat(data.Longitude);
                    const newLatLng = [lat, lng];

                    if (!shuttleMarker) {
                        shuttleMarker = L.marker(newLatLng, { icon: shuttleIcon }).addTo(map);
                        map.setView(newLatLng, 16); 
                    } else {
                        // Smoothly move the marker to the new coordinates
                        shuttleMarker.setLatLng(newLatLng);
                    }
                }
            } catch (error) {
                console.log("Awaiting driver telemetry connection...");
            }
        }

        // Poll n8n every 5 seconds
        setInterval(fetchDriverLocation, 5000);
        fetchDriverLocation(); 
    </script>
</body>
</html>
