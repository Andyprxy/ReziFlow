<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReziFlow | Live Shuttle Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .liquid-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
        }
        #map { width: 100%; height: 400px; border-radius: 24px; z-index: 10; }
        
        /* Custom glowing map marker */
        .live-marker {
            background: #06b6d4;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.8);
        }
    </style>
</head>
<body class="bg-slate-50 p-6">

    <div class="max-w-3xl mx-auto liquid-glass rounded-[32px] p-6 lg:p-8">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h2 class="text-xl font-black text-slate-800">Campus Shuttle</h2>
                <p class="text-xs text-slate-500 font-bold uppercase tracking-widest mt-1"><span class="w-2 h-2 inline-block bg-emerald-500 rounded-full animate-pulse mr-1"></span> Live GPS Tracking</p>
            </div>
            <div class="px-4 py-2 bg-slate-900 text-white text-xs font-bold rounded-xl shadow-md">
                ETA: ~4 Mins
            </div>
        </div>

        <div class="p-2 bg-white border border-slate-200 rounded-[28px] shadow-inner mb-4">
            <div id="map"></div>
        </div>
    </div>

    <script>
        // Initialize Map (Centered on Pretoria/TUT area)
        const map = L.map('map').setView([-25.7479, 28.2293], 15);

        // Load sleek, minimal map tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Create Custom HTML Marker for the Shuttle
        const shuttleIcon = L.divIcon({
            className: 'live-marker',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });

        let shuttleMarker = null;

        // Fetch location from n8n
        async function fetchDriverLocation() {
            try {
                // n8n should output a JSON object like: { "Latitude": -25.7485, "Longitude": 28.2300 }
                const response = await fetch('https://n8n.automania.cloud/webhook/reziflow-get-shuttle');
                const data = await response.json();
                
                if (data.Latitude && data.Longitude) {
                    const newLatLng = [data.Latitude, data.Longitude];

                    // If marker doesn't exist, create it. Otherwise, glide it to new position.
                    if (!shuttleMarker) {
                        shuttleMarker = L.marker(newLatLng, { icon: shuttleIcon }).addTo(map);
                        map.setView(newLatLng, 16); // Zoom in on first load
                    } else {
                        shuttleMarker.setLatLng(newLatLng);
                    }
                }
            } catch (error) {
                console.log("Awaiting driver telemetry...");
            }
        }

        // Poll n8n every 5 seconds for live movement
        setInterval(fetchDriverLocation, 5000);
        fetchDriverLocation(); // Initial load
    </script>
</body>
</html>
