<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ReziFlow | Secure Resident Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #f4f7fb;
            -webkit-font-smoothing: antialiased;
        }

        /* Apple Liquid Glass Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Translucent Inputs */
        .input-field {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 1rem;
            padding: 1rem 1rem 1rem 2.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #0f172a;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1), inset 0 2px 4px rgba(0,0,0,0.01);
        }

        .input-field::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .password-toggle {
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.2s ease;
            padding: 0.5rem;
        }

        .password-toggle:hover {
            color: #3b82f6;
        }

        .tap-effect:active { transform: scale(0.98); transition: transform 0.1s ease; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col relative overflow-hidden justify-center items-center">

    <!-- Premium Background Blobs -->
    <div class="fixed top-[-10%] left-[-10%] w-[60%] h-[60%] bg-blue-500 rounded-full mix-blend-multiply filter blur-[150px] opacity-[0.12] z-0 pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-cyan-400 rounded-full mix-blend-multiply filter blur-[150px] opacity-[0.12] z-0 pointer-events-none"></div>

    <main class="relative z-10 w-full max-w-[420px] px-5 sm:px-0 flex flex-col items-center">
        
        <!-- Floating Header -->
        <div class="flex items-center justify-center gap-3 mb-8 transform hover:scale-105 transition-transform duration-500">
            <div class="w-14 h-14 bg-gradient-to-br from-blue-600 to-cyan-500 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 text-white text-2xl">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <span class="font-black text-4xl tracking-tight text-slate-800 drop-shadow-sm">Rezi<span class="text-blue-600">Flow</span></span>
        </div>

        <!-- Login Card -->
        <div class="glass-panel rounded-[32px] p-8 sm:p-10 w-full relative overflow-hidden">
            
            <div class="text-center mb-8">
                <h1 class="text-2xl font-black text-slate-900 mb-2 tracking-tight">Resident Portal</h1>
                <p class="text-xs text-slate-500 font-medium leading-relaxed px-4">Sign in to access your digital dashboard, utility limits, and facility logs.</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                
                <div class="space-y-5 mb-8">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 pl-2">Student Number</label>
                        <div class="relative group">
                            <div class="absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors">
                                <i class="fa-solid fa-id-card"></i>
                            </div>
                            <input type="text" id="studentNumber" class="input-field" placeholder="e.g. 221227336" required>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2 pl-2 pr-2">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest">Password</label>
                            <a href="#" class="text-[10px] font-bold text-blue-600 hover:text-blue-700 transition-colors">Forgot?</a>
                        </div>
                        <div class="relative group">
                            <div class="absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors">
                                <i class="fa-solid fa-lock"></i>
                            </div>
                            <input type="password" id="password" class="input-field pr-12" placeholder="••••••••" required>
                            <i class="fa-solid fa-eye password-toggle" onclick="togglePassword('password', this)"></i>
                        </div>
                    </div>
                </div>

                <!-- Error Injection Target -->
                <div id="apiError" class="hidden mb-6 bg-rose-50 border border-rose-100 rounded-2xl p-3 flex items-center justify-center gap-2 text-rose-600 text-xs font-bold shadow-sm">
                    <i class="fa-solid fa-shield-xmark"></i>
                    <span id="apiErrorText">Error message here</span>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-slate-900 hover:bg-blue-600 text-white rounded-2xl py-4 font-bold transition-all shadow-lg shadow-slate-900/20 flex items-center justify-center gap-2 tap-effect text-sm">
                    Secure Sign In <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>

            </form>

            <div class="mt-8 pt-6 border-t border-slate-200/60 text-center">
                <p class="text-xs font-medium text-slate-500">
                    Awaiting accommodation? <br>
                    <a href="https://reziflow.online/signup/" class="font-bold text-blue-600 hover:text-blue-700 transition-colors inline-block mt-1.5 px-4 py-2 bg-blue-50 rounded-xl hover:bg-blue-100">Activate your profile here</a>
                </p>
            </div>

        </div>

        <div class="text-center mt-8 flex items-center justify-center gap-2">
            <i class="fa-solid fa-bolt text-blue-500 text-[10px]"></i>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Engineered by Automania</p>
        </div>
    </main>

    <!-- LIVE LOGIC ENGINE -->
    <script>
        // Toggle Password Visibility
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconElement.classList.remove("fa-eye");
                iconElement.classList.add("fa-eye-slash", "text-blue-500");
            } else {
                input.type = "password";
                iconElement.classList.remove("fa-eye-slash", "text-blue-500");
                iconElement.classList.add("fa-eye");
            }
        }

        // Handle Login Submission
        async function handleLogin(e) {
            e.preventDefault();

            const studentNumber = document.getElementById('studentNumber').value;
            const password = document.getElementById('password').value;
            
            const apiErrorBox = document.getElementById('apiError');
            const apiErrorText = document.getElementById('apiErrorText');
            const submitBtn = document.getElementById('submitBtn');

            // Reset Error States
            apiErrorBox.classList.add('hidden');
            submitBtn.classList.remove('bg-rose-500', 'shadow-rose-500/20');
            submitBtn.classList.add('bg-slate-900', 'hover:bg-blue-600', 'shadow-slate-900/20');

            // Loading State UI
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

            try {
                // Live Production Webhook Call
                const response = await fetch('https://n8n.automania.cloud/webhook/reziflow-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Student_Number: studentNumber,
                        Password: password
                    })
                });

                const responseData = await response.json();

                // Validation Catch
                if (responseData.status === 'error' || !response.ok) {
                    throw new Error(responseData.message || "Invalid Student Number or Password.");
                }

                // SUCCESS: Save user session data securely in the browser
                if (responseData.student) {
                    localStorage.setItem('reziflow_session', JSON.stringify(responseData.student));
                }

                // Show Success State on Button
                submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Connection Secured';
                submitBtn.classList.remove('bg-slate-900', 'hover:bg-blue-600', 'shadow-slate-900/20');
                submitBtn.classList.add('bg-emerald-500', 'shadow-emerald-500/30');
                
                // Redirect to Dashboard after visual delay
                setTimeout(() => {
                    window.location.href = 'https://reziflow.online/dashboard/'; 
                }, 600);

            } catch (error) {
                console.error("Login Failed:", error);
                
                // Display the specific error on the UI
                apiErrorText.textContent = error.message;
                apiErrorBox.classList.remove('hidden');

                // Revert button to error state
                submitBtn.innerHTML = 'Sign In Failed - Retry';
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed', 'bg-slate-900', 'hover:bg-blue-600', 'shadow-slate-900/20');
                submitBtn.classList.add('bg-rose-500', 'shadow-rose-500/20');
            }
        }
    </script>
</body>
</html>
