<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReziFlow | Resident Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            -webkit-font-smoothing: antialiased;
        }

        /* Premium Glass Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1);
        }

        .input-field {
            width: 100%;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 0.875rem 1rem;
            font-size: 0.875rem;
            color: #1e293b;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background-color: #ffffff;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: #3b82f6;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col relative overflow-x-hidden justify-center items-center">

    <div class="fixed top-0 left-0 w-full h-full bg-slate-50 z-0">
        <div class="absolute top-0 left-0 w-full h-[45vh] bg-gradient-to-br from-blue-600 to-cyan-500 overflow-hidden rounded-b-[40px] shadow-lg">
            <div class="absolute -top-24 -right-24 w-96 h-96 bg-white rounded-full mix-blend-overlay filter blur-[80px] opacity-30"></div>
            <div class="absolute top-20 -left-20 w-72 h-72 bg-blue-300 rounded-full mix-blend-overlay filter blur-[80px] opacity-40"></div>
        </div>
    </div>

    <main class="relative z-10 w-full max-w-md px-4 py-10">
        
        <div class="flex items-center justify-center gap-3 mb-8">
            <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-layer-group text-blue-600 text-2xl"></i>
            </div>
            <span class="font-black text-3xl tracking-tight text-white drop-shadow-sm">Rezi<span class="text-blue-200">Flow</span></span>
        </div>

        <div class="glass-panel rounded-3xl p-8 md:p-10 w-full relative overflow-hidden">
            
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-900 mb-2">Resident Portal</h1>
                <p class="text-sm text-slate-500">Sign in to access your dashboard, ledger, and maintenance tickets.</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                
                <div class="space-y-5 mb-8">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 pl-1">Student Number</label>
                        <div class="relative">
                            <div class="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400">
                                <i class="fa-solid fa-id-card"></i>
                            </div>
                            <input type="text" id="studentNumber" class="input-field pl-10" placeholder="e.g. 221227336" required>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1.5 pl-1 pr-1">
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Password</label>
                            <a href="#" class="text-xs font-bold text-blue-600 hover:text-blue-700">Forgot?</a>
                        </div>
                        <div class="relative">
                            <div class="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </div>
                            <input type="password" id="password" class="input-field pl-10 pr-10" placeholder="••••••••" required>
                            <i class="fa-solid fa-eye password-toggle" onclick="togglePassword('password', this)"></i>
                        </div>
                    </div>
                </div>

                <p id="apiError" class="text-xs text-rose-500 font-bold text-center mb-4 hidden"></p>

                <button type="submit" id="submitBtn" class="w-full bg-slate-900 hover:bg-blue-600 text-white px-8 py-3.5 rounded-xl font-bold transition-colors shadow-lg shadow-slate-900/20 flex items-center justify-center gap-2">
                    Secure Sign In <i class="fa-solid fa-shield-halved"></i>
                </button>

            </form>

            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <p class="text-sm text-slate-500">
                    Need an account? <br>
                    <a href="https://reziflow.online/signup/" class="font-bold text-blue-600 hover:text-blue-700 hover:underline inline-block mt-1">Activate your profile here</a>
                </p>
            </div>

        </div>

        <div class="text-center mt-8">
            <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Engineered by Automania</p>
        </div>
    </main>

    <script>
        // Toggle Password Visibility
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconElement.classList.remove("fa-eye");
                iconElement.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                iconElement.classList.remove("fa-eye-slash");
                iconElement.classList.add("fa-eye");
            }
        }

        // Handle Login Submission
        async function handleLogin(e) {
            e.preventDefault();

            const studentNumber = document.getElementById('studentNumber').value;
            const password = document.getElementById('password').value;
            
            const apiError = document.getElementById('apiError');
            const submitBtn = document.getElementById('submitBtn');

            // Reset Error States
            apiError.classList.add('hidden');
            submitBtn.classList.remove('bg-rose-500');
            submitBtn.classList.add('bg-slate-900', 'hover:bg-blue-600');

            // Loading State UI
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

            try {
                // Ensure this matches your test or production webhook URL
                const response = await fetch('https://n8n.automania.cloud/webhook/reziflow-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        Student_Number: studentNumber,
                        Password: password
                    })
                });

                // Parse the JSON response
                const responseData = await response.json();

                // If n8n explicitly says "error" or HTTP status fails
                if (responseData.status === 'error' || !response.ok) {
                    throw new Error(responseData.message || "Invalid Student Number or Password.");
                }

                // SUCCESS: Save user session data securely in the browser
                if (responseData.student) {
                    localStorage.setItem('reziflow_session', JSON.stringify(responseData.student));
                }

                // Show Success State on Button
                submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Connection Secured';
                submitBtn.classList.remove('bg-slate-900', 'hover:bg-blue-600');
                submitBtn.classList.add('bg-emerald-500');
                
                // Redirect to Dashboard after 500ms
                setTimeout(() => {
                    window.location.href = 'https://reziflow.online/dashboard/'; // Update this to your actual dashboard URL
                }, 500);

            } catch (error) {
                console.error("Login Failed:", error);
                
                // Display the specific error on the UI
                apiError.innerHTML = `<i class="fa-solid fa-shield-xmark mr-1"></i> ${error.message}`;
                apiError.classList.remove('hidden');

                // Revert button to error state
                submitBtn.innerHTML = 'Sign In Failed - Retry';
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed', 'bg-slate-900', 'hover:bg-blue-600');
                submitBtn.classList.add('bg-rose-500');
            }
        }
    </script>
</body>
</html>
