<script>
        function getSessionData() {
            const rawSession = localStorage.getItem('reziflow_session');
            if (!rawSession) {
                window.location.href = 'https://reziflow.online/login/';
                return null;
            }
            return JSON.parse(rawSession);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const session = getSessionData();
            if(!session) return;

            try {
                // FIX: Force numbers into Strings to prevent .substring() crashes
                const fName = String(session.First_Name || 'Resident');
                const sName = String(session.Surname || '');
                const fullName = `${fName} ${sName}`.trim();
                const initials = (fName.charAt(0) + (sName.charAt(0) || '')).toUpperCase() || 'RF';
                const studentId = String(session.Student_Number || '--');
                const room = String(session.Room_Allocation || 'Unassigned');
                const funding = String(session.Funding_Type || 'Pending');

                document.getElementById('header-initials').textContent = initials;
                document.getElementById('profile-initials').textContent = initials;
                document.getElementById('dyn-fullname-home').textContent = fullName;
                document.getElementById('dyn-id-home').textContent = studentId;
                document.getElementById('dyn-room-home').textContent = room;
                
                const fundingText = `${funding} Cleared`;
                document.getElementById('dyn-funding-home').textContent = fundingText;
                
                document.getElementById('dyn-vetting-badge').textContent = session.Vetting_Status === 'Approved' ? 'Verified Resident' : 'Vetting Pending';
                
                // Inject Device Names dynamically
                document.getElementById('dyn-wifi-dev1').textContent = `${fName}'s iPhone`;
                document.getElementById('dyn-wifi-dev2').textContent = `${fName}'s MacBook`;
                
                document.getElementById('dyn-fullname-profile').textContent = fullName;
                document.getElementById('dyn-details-profile').textContent = `${session.Year_Level || 'Student'} • ${session.Campus_Hub || 'Campus'}`;
                
                document.getElementById('dyn-id-number').textContent = String(session.ID_Number || '--');
                document.getElementById('dyn-gender').textContent = session.Gender || '--';
                document.getElementById('dyn-mobile').textContent = String(session.Mobile_Number || '--');
                document.getElementById('dyn-address').textContent = `${session.Street_Address || ''}, ${session.City || ''}`;
                
                document.getElementById('dyn-guardian-name').textContent = session.Guardian_Name || '--';
                document.getElementById('dyn-guardian-rel').textContent = session.Guardian_Relationship || '--';
                document.getElementById('dyn-guardian-num').textContent = String(session.Guardian_Number || '--');

                document.getElementById('dyn-course-name').textContent = session.Course || '--';
                document.getElementById('dyn-funding-type').textContent = funding;

                const renderDocButton = (containerId, url) => {
                    const container = document.getElementById(containerId);
                    if (url && url.length > 5) {
                        container.innerHTML = `<a href="${url}" target="_blank" class="bg-slate-900 hover:bg-blue-600 text-white text-[10px] font-bold px-4 py-2 rounded-[10px] transition-colors shadow-sm inline-flex items-center gap-1.5 tap-effect"><i class="fa-solid fa-arrow-up-right-from-square"></i> View</a>`;
                    } else {
                        container.innerHTML = `<span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 border-dashed">Awaiting</span>`;
                    }
                };

                renderDocButton('doc-btn-id', session.Doc_1_URL_ID);
                renderDocButton('doc-btn-reg', session.Doc_2_URL_Reg);
                renderDocButton('doc-btn-fund', session.Doc_3_URL_Funding);

                // Now perfectly safe because studentId is strictly a String
                document.getElementById('wifi-pass').textContent = `${initials}-${studentId.substring(0,6)}`;

                // Remove Protection Guard Smoothly
                setTimeout(() => {
                    const guard = document.getElementById('authGuard');
                    if (guard) {
                        guard.style.opacity = '0';
                        setTimeout(() => guard.remove(), 500);
                    }
                }, 400);

            } catch (err) {
                console.error("Payload execution failed:", err);
                
                // Fail-safe: Update the guard screen so you can see if data is broken instead of loading forever
                const guard = document.getElementById('authGuard');
                if(guard) {
                    guard.querySelector('h2').textContent = "Data Error";
                    guard.querySelector('p').textContent = "Failed to parse profile payload.";
                    guard.querySelector('i').className = "fa-solid fa-triangle-exclamation text-rose-500";
                }
            }
        });

        // Visitor PIN Engine
        async function submitVisitorPin(e) {
            e.preventDefault();
            const session = getSessionData();
            const btn = document.getElementById('btn-submit-visitor');
            const ogText = btn.innerHTML;
            const fname = document.getElementById('vis-fname').value;
            const sname = document.getElementById('vis-sname').value;
            const email = document.getElementById('vis-email').value;
            
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
            btn.disabled = true;

            try {
                const res = await fetch('https://n8n.automania.cloud/webhook-test/reziflow-visitor-pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Student_Number: session.Student_Number,
                        Room_Allocation: session.Room_Allocation,
                        Visitor_Name: fname,
                        Visitor_Surname: sname,
                        Visitor_Email: email
                    })
                });
                
                const data = await res.json();
                
                closeModal('visitorModal');
                document.getElementById('pin-display-container').classList.remove('hidden');
                document.getElementById('generated-pin').textContent = data.pin || Math.floor(100000 + Math.random() * 900000); 
                
                showToast("Visitor PIN Generated", "success");
                document.getElementById('visitorForm').reset();
                btn.disabled = false;
                btn.innerHTML = ogText;

            } catch (error) {
                showToast("Failed to connect to access system.", "error");
                btn.innerHTML = ogText;
                btn.disabled = false;
            }
        }

        function openModalWithCategory(categoryStr) {
            document.getElementById('snag-category').value = categoryStr;
            openModal('snagModal');
        }

        async function submitSnag(e) {
            e.preventDefault();
            const session = getSessionData();
            const btn = document.getElementById('btn-submit-snag');
            const category = document.getElementById('snag-category').value;
            const desc = document.getElementById('snag-desc').value;

            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Submitting...';
            btn.disabled = true;

            try {
                await fetch('https://n8n.automania.cloud/webhook-test/reziflow-log-snag', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Student_Number: session.Student_Number,
                        Room_Allocation: session.Room_Allocation,
                        Category: category,
                        Description: desc
                    })
                });
                closeModal('snagModal');
                showToast("Ticket submitted. Maintenance notified.", "success");
                document.getElementById('snagForm').reset();
            } catch(error) {
                showToast("Submission failed. Try again.", "error");
            } finally {
                btn.innerHTML = 'Submit Ticket <i class="fa-solid fa-arrow-right"></i>';
                btn.disabled = false;
            }
        }

        async function triggerSOS() {
            const session = getSessionData();
            const btn = document.getElementById('btn-sos');
            const icon = document.getElementById('sos-icon');
            const text = document.getElementById('sos-text');

            btn.classList.replace('bg-red-600', 'bg-orange-500');
            icon.classList.replace('fa-light-emergency-on', 'fa-circle-notch');
            icon.classList.add('fa-spin');
            text.textContent = 'Sending...';
            btn.disabled = true;

            try {
                await fetch('https://n8n.automania.cloud/webhook-test/reziflow-sos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Student_Number: session.Student_Number,
                        Room_Allocation: session.Room_Allocation,
                        Type: "EMERGENCY_SOS"
                    })
                });

                btn.classList.replace('bg-orange-500', 'bg-emerald-500');
                icon.classList.remove('fa-circle-notch', 'fa-spin');
                icon.classList.add('fa-check');
                text.textContent = 'Dispatched';
                showToast("Security Dispatched to your location.", "success");

                setTimeout(() => {
                    btn.classList.replace('bg-emerald-500', 'bg-red-600');
                    icon.classList.replace('fa-check', 'fa-light-emergency-on');
                    text.textContent = 'SOS';
                    btn.disabled = false;
                }, 5000);

            } catch(error) {
                showToast("Connection error. Call security directly.", "error");
                btn.classList.replace('bg-orange-500', 'bg-red-600');
                icon.classList.replace('fa-circle-notch', 'fa-light-emergency-on');
                icon.classList.remove('fa-spin');
                text.textContent = 'SOS';
                btn.disabled = false;
            }
        }

        async function sendSecurityPing() {
            const session = getSessionData();
            const btn = document.getElementById('btn-security-ping');
            const pingType = document.getElementById('selected-security-type').value;
            const notes = document.getElementById('security-notes').value;

            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Transmitting...';
            btn.disabled = true;

            try {
                await fetch('https://n8n.automania.cloud/webhook-test/reziflow-security-ping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Student_Number: session.Student_Number,
                        Room_Allocation: session.Room_Allocation,
                        Ping_Type: pingType,
                        Notes: notes
                    })
                });
                showToast(`Alert sent for: ${pingType}`, "success");
                document.getElementById('security-notes').value = '';
            } catch(error) {
                showToast("Transmission failed.", "error");
            } finally {
                btn.innerHTML = '<i class="fa-regular fa-paper-plane"></i> Send Alert';
                btn.disabled = false;
            }
        }

        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            const text = document.getElementById('toast-text');
            const icon = document.getElementById('toast-icon');

            text.textContent = message;
            if(type === 'error') {
                icon.className = 'fa-solid fa-triangle-exclamation text-rose-500';
            } else {
                icon.className = 'fa-solid fa-circle-check text-emerald-400';
            }

            container.classList.add('show');
            setTimeout(() => { container.classList.remove('show'); }, 3500);
        }

        function selectSecurityOption(element, optionName) {
            document.querySelectorAll('.sec-option').forEach(btn => {
                btn.className = 'sec-option bg-slate-50 border border-slate-100 rounded-[20px] p-3 text-left tap-effect transition-all';
                btn.querySelector('i').className = btn.querySelector('i').className.replace('text-blue-600', 'text-blue-500');
                btn.querySelector('span').className = 'text-xs font-semibold text-slate-700';
            });
            element.className = 'sec-option bg-blue-100 border-2 border-blue-600 rounded-[20px] p-3 text-left tap-effect transition-all active-sec-option';
            element.querySelector('i').className = element.querySelector('i').className.replace('text-blue-500', 'text-blue-600');
            element.querySelector('span').className = 'text-xs font-semibold text-slate-900';
            
            document.getElementById('selected-security-type').value = optionName;
            document.getElementById('security-notes').placeholder = `Add details for "${optionName}"...`;
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function togglePasswordVisibility() {
            const passEl = document.getElementById('wifi-pass');
            const iconEl = document.getElementById('eye-icon');
            if (passEl.classList.contains('blur-sm')) {
                passEl.classList.remove('blur-sm');
                iconEl.className = 'fa-solid fa-eye-slash text-blue-500';
            } else {
                passEl.classList.add('blur-sm');
                iconEl.className = 'fa-solid fa-eye text-slate-600';
            }
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-blue-600');
                btn.querySelector('span').classList.remove('font-bold');
                btn.querySelector('span').classList.add('font-medium');
            });
            btnElement.classList.add('text-blue-600');
            btnElement.querySelector('span').classList.remove('font-medium');
            btnElement.querySelector('span').classList.add('font-bold');
        }

        function handleLogout() {
            localStorage.removeItem('reziflow_session');
            window.location.href = 'https://reziflow.online/login/';
        }
    </script>
