<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReziFlow | Driver Telemetry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .liquid-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.1);
        }
        .pulse-ring {
            animation: pulsate 1.5s infinite ease-out;
        }
        @keyframes pulsate {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            100% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">

    <div class="liquid-glass rounded-[32px] p-8 max-w-sm w-full text-center">
        <div class="w-16 h-16 bg-slate-900 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl mb-4 shadow-lg">
            <i class="fa-solid fa-van-shuttle"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-800 mb-1">Shuttle Ops</h2>
        <p class="text-sm text-slate-500 mb-8 font-medium">Live GPS Telemetry Link</p>

        <button id="btn-broadcast" onclick="toggleBroadcast()" class="w-full bg-slate-900 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl transition-all shadow-lg flex items-center justify-center gap-3">
            <i class="fa-solid fa-satellite-dish"></i> <span>Start Broadcasting</span>
        </button>

        <div id="status-log" class="mt-6 text-[10px] font-mono text-slate-400 h-20 overflow-hidden text-left bg-white/50 p-4 rounded-xl border border-slate-100 hidden">
            </div>
    </div>

    <script>
        let watchId;
        let isBroadcasting = false;

        function toggleBroadcast() {
            const btn = document.getElementById('btn-broadcast');
            const log = document.getElementById('status-log');

            if (!isBroadcasting) {
                if ("geolocation" in navigator) {
                    btn.classList.add('bg-emerald-500', 'pulse-ring');
                    btn.classList.remove('bg-slate-900');
                    btn.innerHTML = '<i class="fa-solid fa-satellite-dish"></i> <span>Transmitting Live...</span>';
                    log.classList.remove('hidden');
                    isBroadcasting = true;

                    // High-accuracy continuous GPS tracking
                    watchId = navigator.geolocation.watchPosition(
                        sendLocationToN8n, 
                        (err) => addLog("GPS Error: " + err.message),
                        { enableHighAccuracy: true, maximumAge: 0 }
                    );
                    addLog("GPS Hook Established. Awaiting sats...");
                } else {
                    alert("Geolocation is not supported by this browser.");
                }
            } else {
                navigator.geolocation.clearWatch(watchId);
                btn.classList.remove('bg-emerald-500', 'pulse-ring');
                btn.classList.add('bg-slate-900');
                btn.innerHTML = '<i class="fa-solid fa-satellite-dish"></i> <span>Start Broadcasting</span>';
                isBroadcasting = false;
                addLog("Transmission offline.");
            }
        }

        async function sendLocationToN8n(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const speed = position.coords.speed || 0; // Speed in m/s if available

            addLog(`Ping: [${lat.toFixed(4)}, ${lng.toFixed(4)}]`);

            // Push to your n8n engine
            fetch('https://n8n.automania.cloud/webhook/reziflow-driver-gps', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    Driver_ID: "SHUTTLE-01",
                    Latitude: lat,
                    Longitude: lng,
                    Speed: speed,
                    Timestamp: new Date().toISOString()
                })
            }).catch(e => console.log("Failed to sync with cloud."));
        }

        function addLog(msg) {
            const logBox = document.getElementById('status-log');
            logBox.innerHTML = `<div>> ${msg}</div>` + logBox.innerHTML;
        }
    </script>
</body>
</html>
