<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ReziFlow | Driver Telemetry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f4f7fb; }
        
        .liquid-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
        }
        
        #driver-map { height: 250px; border-radius: 20px; z-index: 10; }
        
        .pulse-ring { animation: pulsate 1.5s infinite ease-out; }
        @keyframes pulsate {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            100% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
        }
        
        .driver-marker {
            background: #10b981;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.8);
            transition: all 0.5s ease-out;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative overflow-hidden">

    <div class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-blue-400 rounded-full mix-blend-multiply filter blur-[120px] opacity-[0.15] z-0"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-cyan-400 rounded-full mix-blend-multiply filter blur-[120px] opacity-[0.15] z-0"></div>

    <div class="liquid-glass rounded-[32px] p-6 max-w-sm w-full text-center relative z-10">
        <h2 class="text-xl font-black text-slate-800 tracking-tight mb-1">Shuttle Ops</h2>
        <p class="text-[10px] text-slate-500 mb-4 font-bold uppercase tracking-widest">Active Transmission Relay</p>

        <div class="p-1.5 bg-white border border-slate-200 rounded-[24px] shadow-sm mb-6">
            <div id="driver-map"></div>
        </div>

        <button id="btn-broadcast" onclick="toggleBroadcast()" class="w-full bg-slate-900 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl transition-all duration-300 shadow-xl flex items-center justify-center gap-3">
            <i class="fa-solid fa-satellite-dish"></i> <span id="btn-text">Start Broadcasting</span>
        </button>
    </div>

    <script>
        let watchId;
        let isBroadcasting = false;
        
        // Initialize Map
        const map = L.map('driver-map').setView([-25.7479, 28.2293], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
        
        const driverIcon = L.divIcon({ className: 'driver-marker', iconSize: [16, 16], iconAnchor: [8, 8] });
        let marker = null;

        function toggleBroadcast() {
            const btn = document.getElementById('btn-broadcast');
            const btnText = document.getElementById('btn-text');

            if (!isBroadcasting) {
                if ("geolocation" in navigator) {
                    btn.classList.add('bg-emerald-500', 'pulse-ring');
                    btn.classList.remove('bg-slate-900');
                    btnText.innerText = 'Transmitting Live...';
                    isBroadcasting = true;

                    watchId = navigator.geolocation.watchPosition(
                        sendLocationToN8n, 
                        (err) => alert("GPS Error: Ensure location permissions are allowed."),
                        { enableHighAccuracy: true, maximumAge: 0 }
                    );
                } else {
                    alert("Geolocation is not supported by this browser.");
                }
            } else {
                navigator.geolocation.clearWatch(watchId);
                btn.classList.remove('bg-emerald-500', 'pulse-ring');
                btn.classList.add('bg-slate-900');
                btnText.innerText = 'Start Broadcasting';
                isBroadcasting = false;
            }
        }

        async function sendLocationToN8n(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const newLatLng = [lat, lng];

            // Update local map visually
            if (!marker) {
                marker = L.marker(newLatLng, { icon: driverIcon }).addTo(map);
            } else {
                marker.setLatLng(newLatLng);
            }
            map.setView(newLatLng, 17);

            // POST to n8n Ingest Webhook
            fetch('https://n8n.automania.cloud/webhook/reziflow-driver-gps', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    Driver_ID: "SHUTTLE-01",
                    Latitude: lat,
                    Longitude: lng,
                    Timestamp: new Date().toISOString()
                })
            }).catch(e => console.log("Cloud sync failed."));
        }
    </script>
</body>
</html>
