<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ReziFlow | Phumelela Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        /* Deep mobile optimization */
        body, html { 
            font-family: 'Inter', sans-serif; margin: 0; padding: 0; 
            width: 100%; height: 100%; height: 100dvh; /* Force dynamic viewport height */
            position: fixed; overflow: hidden; overscroll-behavior-y: none;
            background-color: #0f172a; -webkit-font-smoothing: antialiased;
        }

        .desktop-bg { position: absolute; inset: 0; z-index: -1; overflow: hidden; background: #0f172a; display: none; }
        @media (min-width: 640px) { .desktop-bg { display: block; } }
        .desktop-bg::before { content: ''; position: absolute; top: -20%; left: -10%; width: 60%; height: 60%; background: #3b82f6; border-radius: 50%; filter: blur(150px); opacity: 0.15; }
        .desktop-bg::after { content: ''; position: absolute; bottom: -20%; right: -10%; width: 60%; height: 60%; background: #06b6d4; border-radius: 50%; filter: blur(150px); opacity: 0.15; }

        .mobile-container { 
            width: 100%; height: 100%; height: 100dvh; background: #f0f4f8; 
            position: relative; display: flex; flex-direction: column; 
            overflow: hidden; margin: 0 auto; 
        }
        @media (min-width: 640px) {
            body { display: flex; align-items: center; justify-content: center; position: static; overflow: auto; min-height: 100vh; }
            .mobile-container { width: 100%; max-width: 420px; height: 90vh; max-height: 880px; border-radius: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 0 2px rgba(255,255,255,0.2); border: 8px solid #1e293b; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4); border-top: 1px solid rgba(255, 255, 255, 0.8); border-left: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(30, 41, 59, 0.15), inset 0 1px 0 rgba(255,255,255,0.8); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tab-content { animation: fadeIn 0.3s ease-in-out; padding-bottom: 24px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spinOnce { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spin-once { animation: spinOnce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* Native iOS scrolling feel */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        
        .custom-scroll { -webkit-overflow-scrolling: touch; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .tap-effect:active { transform: scale(0.97); transition: transform 0.1s ease; }
        .card-shadow { box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.04); }
        .soft-border { border: 1px solid rgba(226, 232, 240, 0.6); }

        .modal-overlay { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 2000; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1); }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        #toast-container { transform: translateY(-150%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; }
        #toast-container.show { transform: translateY(0); }

        .input-field { width: 100%; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 0.875rem 1rem; font-size: 0.75rem; font-weight: 600; color: #0f172a; transition: all 0.2s ease; }
        .input-field:focus { outline: none; border-color: #3b82f6; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        select.input-field { appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.2em 1.2em; }

        .nav-locked { opacity: 0.5; filter: grayscale(100%); transition: all 0.3s ease; cursor: not-allowed; }
        .upload-zone { border: 2px dashed rgba(203, 213, 225, 0.8); background: rgba(255, 255, 255, 0.5); transition: all 0.2s ease; }
        .upload-zone:hover { border-color: #3b82f6; background-color: rgba(239, 246, 255, 0.8); }
        .upload-zone.success-state { border: 2px solid #10b981; background-color: rgba(236, 253, 245, 0.9); }
        
        .funding-card { background: rgba(255, 255, 255, 0.6); transition: all 0.2s ease; }
        .funding-card.active { border-color: #3b82f6; background-color: #eff6ff; box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.2); }
        .doc-section { display: none; animation: fadeIn 0.4s ease forwards; }
        .doc-section.active { display: block; }

        #telemetry-map { width: 100%; height: 380px; border-radius: 24px; }
    </style>
</head>
<body>

    <div class="desktop-bg"></div>

    <div class="mobile-container">
        
        <!-- GLOBAL MODALS -->
        <div id="toast-container" class="absolute top-6 left-0 right-0 flex justify-center px-4 pointer-events-none z-[9999]">
            <div id="toast-message" class="bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl shadow-slate-900/20 flex items-center gap-3 font-medium text-sm border border-slate-700">
                <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
                <span id="toast-text">Action completed successfully.</span>
            </div>
        </div>

        <div id="authGuard" class="absolute inset-0 bg-white z-[1900] flex flex-col items-center justify-center p-6 text-center text-slate-800 font-medium transition-all duration-500">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center mb-4 text-2xl shadow-sm animate-pulse"><i class="fa-solid fa-layer-group"></i></div>
            <h2 class="text-xl font-bold tracking-tight mb-1">Authenticating</h2>
            <p id="auth-status-text" class="text-xs text-slate-500">Verifying live server profile...</p>
        </div>

        <!-- HEADER -->
        <header class="flex-shrink-0 pt-6 px-5 z-40 bg-[#f0f4f8]/90 backdrop-blur-md pb-4">
            <div class="bg-white rounded-full px-5 py-3.5 flex justify-between items-center card-shadow soft-border">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-blue-500 text-xl"></i>
                    <span class="font-bold text-lg tracking-tight text-slate-900">Rezi<span class="text-blue-500">Flow</span></span>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="handleLogout()" class="w-9 h-9 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center font-bold text-sm shadow-sm hover:bg-rose-500 hover:text-white transition-colors tap-effect" title="Secure Logout"><i class="fa-solid fa-power-off"></i></button>
                    <button onclick="navigateTo('#profile')" class="w-9 h-9 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold text-sm shadow-md shadow-blue-500/20 tap-effect overflow-hidden" id="header-initials">--</button>
                </div>
            </div>
        </header>

        <!-- ROUTER INJECTION ROOT -->
        <!-- Added massive pb-32 to fix iPhone scroll trapping. Ensures scrollability past the fixed ribbon. -->
        <main class="flex-1 overflow-y-auto no-scrollbar relative z-10 px-5 pt-2 pb-32" id="portal-root">
            <!-- Subfiles inject here -->
        </main>

        <!-- NAVIGATION -->
        <!-- Safe area inset added perfectly for iPhone home bars -->
        <nav class="flex-shrink-0 bg-white pt-3 px-6 border-t border-slate-100 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] z-50 pb-[calc(1.2rem+env(safe-area-inset-bottom))] relative">
            <div class="flex justify-between items-center w-full">
                <button onclick="navigateTo('#home')" id="nav-home" class="nav-btn text-blue-600 flex flex-col items-center gap-1 tap-effect transition-colors"><i class="fa-solid fa-house text-lg mb-0.5"></i><span class="text-[10px] font-bold">Home</span></button>
                <button onclick="navigateTo('#wifi')" id="nav-wifi" class="nav-btn text-slate-400 flex flex-col items-center gap-1 tap-effect transition-colors nav-locked pointer-events-none"><i class="fa-solid fa-wifi text-lg mb-0.5"></i><span class="text-[10px] font-medium">Wi-Fi</span></button>
                <button onclick="navigateTo('#snags')" id="nav-snags" class="nav-btn text-slate-400 flex flex-col items-center gap-1 tap-effect transition-colors nav-locked pointer-events-none"><i class="fa-solid fa-wrench text-lg mb-0.5"></i><span class="text-[10px] font-medium">Snags</span></button>
                <button onclick="navigateTo('#security')" id="nav-security" class="nav-btn text-slate-400 flex flex-col items-center gap-1 tap-effect transition-colors nav-locked pointer-events-none"><i class="fa-solid fa-shield-halved text-lg mb-0.5"></i><span class="text-[10px] font-medium">Security</span></button>
                <button onclick="openShuttleMap()" id="nav-transit" class="text-slate-400 flex flex-col items-center gap-1 tap-effect transition-colors relative nav-locked pointer-events-none"><i class="fa-solid fa-van-shuttle text-lg mb-0.5"></i><span class="text-[10px] font-medium">Transit</span></button>
            </div>
            <div class="w-1/3 h-1.5 bg-slate-200 rounded-full mx-auto mt-5 hidden sm:block"></div>
        </nav>
    </div>

    <!-- CORE ENGINE & HASH ROUTER -->
    <script>
        let gatewayPercentage = 0; let profilePercentage = 0; let vaultPercentage = 0;

        const profileDataFields = ['First_Name', 'Surname', 'Mobile_Number', 'Student_Number', 'ID_Number', 'Gender', 'Email_Address', 'Campus_Hub', 'Course', 'Year_Level', 'Street_Address', 'City', 'Postal_Code', 'Guardian_Name', 'Guardian_Number', 'Guardian_Relationship'];
        const safeSetText = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
        const safeSetHtml = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
        const safeSetDisplay = (id, display) => { const el = document.getElementById(id); if (el) el.style.display = display; };
        
        // ==========================================
        // HASH-BASED SPA ROUTER
        // ==========================================
        const routes = {
            '': 'home/index.html',
            '#home': 'home/index.html',
            '#wifi': 'wifi/index.html',
            '#snags': 'snags/index.html',
            '#security': 'security/index.html',
            '#profile': 'profile/index.html'
        };

        async function navigateTo(hash) {
            const session = getSessionData();
            
            const isVettingApproved = isValidData(session.Vetting_Status) && String(session.Vetting_Status).trim().toLowerCase() === 'approved';
            const isRoomAllocated = isValidData(session.Room_Allocation) && session.Room_Allocation !== 'Unassigned' && session.Room_Allocation !== '--';
            const isFullySigned = isValidData(session.Doc_Lease_URL) || session.Signed_Lease === "Signed";
            const isAppUnlocked = (isVettingApproved && isRoomAllocated) || isFullySigned;

            // Security Check
            if (!isAppUnlocked && hash !== '#home' && hash !== '' && hash !== '#profile') {
                showToast("⚠️ Please finish up updating to unlock full portal.", "error");
                const card = document.getElementById('gateway-unlock-card');
                if (card) { card.classList.add('border-rose-400', 'bg-rose-50'); setTimeout(() => card.classList.remove('border-rose-400', 'bg-rose-50'), 600); }
                hash = '#home'; 
            }

            window.location.hash = hash || '#home';
            const viewUrl = routes[hash] || 'home/index.html';
            
            try {
                const response = await fetch(viewUrl);
                if (!response.ok) throw new Error("View not found");
                const html = await response.text();
                
                const root = document.getElementById('portal-root');
                root.innerHTML = html;
                root.scrollTop = 0; // Reset scroll on navigation
                
                updateNavUI(hash);
                hydrateGatewayEngine(true, session);
            } catch (error) { showToast("Failed to load module.", "error"); }
        }

        window.addEventListener("hashchange", () => navigateTo(window.location.hash));

        function updateNavUI(hash) {
            document.querySelectorAll('.nav-btn').forEach(btn => { btn.classList.remove('text-blue-600'); btn.classList.add('text-slate-400'); });
            if(hash === '#wifi') { const btn = document.getElementById('nav-wifi'); if(btn) btn.classList.replace('text-slate-400', 'text-blue-600'); } 
            else if(hash === '#snags') { const btn = document.getElementById('nav-snags'); if(btn) btn.classList.replace('text-slate-400', 'text-blue-600'); } 
            else if(hash === '#security') { const btn = document.getElementById('nav-security'); if(btn) btn.classList.replace('text-slate-400', 'text-blue-600'); } 
            else { const btn = document.getElementById('nav-home'); if(btn) btn.classList.replace('text-slate-400', 'text-blue-600'); }
        }

        // ==========================================
        // DATA & SYNC ENGINE
        // ==========================================
        function getSessionData() {
            let rawSession = localStorage.getItem('reziflow_session');
            if (!rawSession) return {};
            try { return JSON.parse(rawSession); } catch (e) { return {}; }
        }

        function isValidData(value) {
            if (value === null || value === undefined) return false;
            const strVal = String(value).trim(); return strVal !== '' && strVal !== '--' && strVal !== 'undefined' && strVal.toLowerCase() !== 'new';
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const session = getSessionData(); const email = session.Email_Address || session.Email;
            const authGuard = document.getElementById('authGuard'); 
            
            // Bypass full sync logic here for simplicity of UI testing.
            if(authGuard) { authGuard.style.opacity = '0'; setTimeout(() => authGuard.style.display = 'none', 500); }
            navigateTo(window.location.hash || '#home');
        });

        // ==========================================
        // UI HYDRATION & COMPONENT POPULATION
        // ==========================================
        function hydrateGatewayEngine(isSilentBackgroundUpdate = false, overrideSession = null) {
            const session = overrideSession || getSessionData();
            
            const initials = (String(session.First_Name || 'R').charAt(0) + String(session.Surname || 'F').charAt(0)).toUpperCase();
            safeSetText('header-initials', initials); safeSetText('profile-initials', initials);
            
            const fullName = `${session.First_Name || 'New'} ${session.Surname || ''}`.trim();
            safeSetText('dyn-fullname-home', fullName); 
            
            const studentId = isValidData(session.Student_Number) ? String(session.Student_Number) : '--';
            safeSetText('dyn-id-home', studentId); 
            
            const roomAllocatedStr = isValidData(session.Room_Allocation) ? String(session.Room_Allocation) : 'Unassigned';
            safeSetText('dyn-room-home', roomAllocatedStr);
            
            // CORE GATEWAY PROTOCOL
            const isVettingApproved = isValidData(session.Vetting_Status) && String(session.Vetting_Status).trim().toLowerCase() === 'approved';
            const isRoomAllocated = isValidData(session.Room_Allocation) && session.Room_Allocation !== 'Unassigned' && session.Room_Allocation !== '--';
            const isFullySigned = isValidData(session.Doc_Lease_URL) || session.Signed_Lease === "Signed";
            
            const shouldUnlockTabs = (isVettingApproved && isRoomAllocated) || isFullySigned;

            const navElements = [document.getElementById('nav-wifi'), document.getElementById('nav-snags'), document.getElementById('nav-security'), document.getElementById('nav-transit')];
            navElements.forEach(el => {
                if (el) {
                    if (shouldUnlockTabs) el.classList.remove('nav-locked', 'pointer-events-none');
                    else el.classList.add('nav-locked', 'pointer-events-none');
                }
            });

            // UNLOCK VISITOR PIN VISIBILITY (BUT DO NOT AUTO GENERATE)
            const visitorPinContainer = document.getElementById('visitor-pin-container');
            if (visitorPinContainer) {
                if (shouldUnlockTabs) visitorPinContainer.classList.remove('hidden');
                else visitorPinContainer.classList.add('hidden');
            }
        }

        // ==========================================
        // UTILITIES & MAINTENANCE LOGIC
        // ==========================================

        function showToast(message, type) {
            const container = document.getElementById('toast-container'); const text = document.getElementById('toast-text'); const icon = document.getElementById('toast-icon');
            text.textContent = message; if(type === 'error') icon.className = 'fa-solid fa-triangle-exclamation text-rose-500'; else icon.className = 'fa-solid fa-circle-check text-emerald-400';
            container.classList.add('show'); setTimeout(() => { container.classList.remove('show'); }, 3500);
        }

        function handleLogout() { localStorage.removeItem('reziflow_session'); window.location.href = '/phumelela/signin'; }
    </script>
</body>
</html>
