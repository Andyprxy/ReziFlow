<div class="space-y-5">
    <section id="resident-blue-card" class="bg-gradient-to-br from-blue-600 to-cyan-400 rounded-[28px] p-6 text-white shadow-lg relative overflow-hidden tap-effect">
        <div class="relative z-10 flex justify-between items-start mb-8">
            <div><p class="text-blue-100 text-[10px] font-bold uppercase tracking-widest mb-1.5" id="dyn-vetting-badge">Pending Vetting</p><h1 id="dyn-fullname-home" class="text-2xl font-bold">Loading...</h1></div>
            <div class="bg-white/20 px-3 py-1.5 rounded-full text-[10px] font-bold"><span class="w-1.5 h-1.5 bg-emerald-300 rounded-full animate-pulse inline-block"></span> Active</div>
        </div>
        <div class="relative z-10 flex gap-8">
            <div><p class="text-blue-100 text-[10px] uppercase font-bold tracking-wider mb-1">Student ID</p><p id="dyn-id-home" class="font-bold text-sm">--</p></div>
            <div><p class="text-blue-100 text-[10px] uppercase font-bold tracking-wider mb-1">Room</p><p id="dyn-room-home" class="font-bold text-sm">--</p></div>
        </div>
    </section>

    <section id="gateway-unlock-card" class="bg-white card-shadow soft-border rounded-[28px] p-5 relative border-2 border-transparent">
        <div class="flex items-center gap-4 relative z-10 mb-4">
            <div class="w-14 h-14 rounded-[18px] shadow-sm border border-slate-100 bg-slate-100 flex items-center justify-center text-slate-400"><i class="fa-solid fa-shield"></i></div>
            <div><div class="flex items-center gap-2 mb-0.5"><h3 class="text-sm font-black text-slate-900">Gateway Protocol</h3><i id="gateway-lock-icon" class="fa-solid fa-lock text-rose-500 text-xs"></i></div><p id="gateway-status-text" class="text-[10px] text-slate-500 font-medium">Finish setting up your profile to unlock Wi-Fi & Transit.</p></div>
        </div>
        <div id="gateway-dynamic-content" class="relative z-10 bg-slate-50 rounded-xl p-3 border border-slate-100 flex flex-col gap-2"></div>
    </section>

    <div id="lease-magic-slot" class="hidden glass-panel rounded-[28px] p-6 relative">
        <div class="flex justify-between items-start mb-4 relative z-10">
            <div><h3 class="text-base font-black text-slate-900 mb-1">Accommodation Lease</h3><p class="text-[11px] text-slate-600">Review terms. Sign once approved.</p></div>
        </div>
        <div class="bg-white/50 border border-white/60 rounded-[20px] p-4 flex flex-col gap-4 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-100/80 text-blue-600 flex items-center justify-center"><i class="fa-solid fa-file-signature"></i></div>
                <div><p class="text-sm font-bold text-slate-800">Academic Year Lease</p><p id="home-lease-status" class="text-[10px] text-rose-500 font-bold uppercase"><i class="fa-solid fa-circle-exclamation mr-1"></i> Pending</p></div>
            </div>
            <button onclick="window.openModal('leaseModal')" id="btn-home-lease" class="w-full bg-blue-600 text-white font-bold rounded-xl py-3 text-xs shadow-md tap-effect">Review Terms</button>
        </div>
    </div>

    <section>
        <h3 class="text-sm font-bold text-slate-800 mb-3 ml-2">Building Access</h3>
        <div class="flex gap-3">
            <button class="flex-1 bg-[#e8f1fb] py-4 rounded-[20px] flex flex-col items-center gap-2 shadow-sm"><i class="fa-solid fa-key text-blue-500 text-xl"></i><span class="text-xs font-semibold text-slate-700">Turnstiles</span></button>
            <button onclick="window.openModal('visitorModal')" class="flex-1 bg-[#e8f1fb] py-4 rounded-[20px] flex flex-col items-center gap-2 shadow-sm"><i class="fa-solid fa-user-plus text-blue-500 text-xl"></i><span class="text-xs font-semibold text-slate-700">Visitor PIN</span></button>
        </div>
    </section>
    
    <div id="pin-display-container" class="hidden bg-emerald-50 border border-emerald-200 rounded-[20px] p-4 text-center mt-2 shadow-sm">
        <p class="text-xs text-emerald-600 font-bold uppercase">Active Visitor PIN</p>
        <p id="generated-pin" class="text-3xl font-mono font-bold text-slate-800">------</p>
    </div>
</div>

<script>
    // Tab-specific rendering bound to the global scope
    window.renderHomeData = function() {
        const session = window.getSessionData();
        const elName = document.getElementById('dyn-fullname-home'); if(elName) elName.textContent = `${session.First_Name||'New'} ${session.Surname||''}`.trim();
        const elId = document.getElementById('dyn-id-home'); if(elId) elId.textContent = session.Student_Number || '--';
        const elRoom = document.getElementById('dyn-room-home'); if(elRoom) elRoom.textContent = session.Room_Allocation || 'Unassigned';
        
        // Progress Bars UI Builder
        const profilePct = session.First_Name ? 100 : 0; // Simplified for digest, apply full math here
        const vaultPct = session.Doc_1_URL_ID ? 100 : 0;
        
        const html = `
            <div onclick="window.openWizardFlow('profile')" class="p-2 hover:bg-slate-100 rounded-lg cursor-pointer tap-effect border-b border-slate-100 flex justify-between items-center">
                <span class="text-[9px] font-bold text-slate-400 uppercase">Profile Info</span>
                <span class="text-[10px] font-black text-blue-600">${profilePct}%</span>
            </div>
            <div onclick="window.openWizardFlow('documents')" class="p-2 hover:bg-slate-100 rounded-lg cursor-pointer tap-effect flex justify-between items-center">
                <span class="text-[9px] font-bold text-slate-400 uppercase">Documents</span>
                <span class="text-[10px] font-black text-indigo-500">${vaultPct}%</span>
            </div>
            ${profilePct === 100 && vaultPct === 100 ? `<button class="w-full mt-2 bg-blue-600 text-white font-bold rounded-xl py-3 text-sm">Alert Admin</button>` : ''}
        `;
        const gw = document.getElementById('gateway-dynamic-content'); if(gw) gw.innerHTML = html;
        
        const isAppr = session.Vetting_Status === 'Approved';
        const elSlot = document.getElementById('lease-magic-slot'); 
        if(elSlot) { if(isAppr) elSlot.classList.remove('hidden'); else elSlot.classList.add('hidden'); }
    };
</script>
