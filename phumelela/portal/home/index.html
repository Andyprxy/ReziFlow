<div class="space-y-5 animate-[fadeIn_0.3s_ease-in-out]">
    
    <section id="resident-blue-card" class="bg-gradient-to-br from-blue-600 to-cyan-400 rounded-[28px] p-6 text-white shadow-lg shadow-blue-500/20 relative overflow-hidden tap-effect">
        <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-white opacity-10 rounded-full blur-2xl"></div>
        <div class="relative z-10 flex justify-between items-start mb-8">
            <div>
                <p class="text-blue-100 text-[10px] font-bold uppercase tracking-widest mb-1.5" id="dyn-vetting-badge">Verified Resident</p>
                <h1 id="dyn-fullname-home" class="text-2xl font-bold leading-tight tracking-tight">Loading...</h1>
            </div>
            <div class="bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-full text-[10px] font-bold flex items-center gap-1.5 shadow-sm border border-white/10">
                <span class="w-1.5 h-1.5 bg-emerald-300 rounded-full animate-pulse"></span> Active
            </div>
        </div>
        <div class="relative z-10 flex gap-8">
            <div><p class="text-blue-100 text-[10px] uppercase font-bold tracking-wider mb-1">Student ID</p><p id="dyn-id-home" class="font-bold text-sm">--</p></div>
            <div><p class="text-blue-100 text-[10px] uppercase font-bold tracking-wider mb-1">Room</p><p id="dyn-room-home" class="font-bold text-sm">--</p></div>
        </div>
    </section>

    <!-- DYNAMIC VISITOR PIN -->
    <!-- The Mother Portal handles 'hidden' vs 'visible'. But it defaults to request state -->
    <div id="visitor-pin-container" class="hidden bg-emerald-50 border border-emerald-200 rounded-[20px] p-4 text-center shadow-sm transition-all duration-500 mt-2">
        
        <!-- DEFAULT STATE: Wait for user to explicitly request -->
        <div id="pin-request-state">
            <button onclick="generateVisitorPin(this)" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-3.5 rounded-xl transition-colors tap-effect shadow-md flex items-center justify-center gap-2">
                <i class="fa-solid fa-key"></i> Generate Visitor PIN
            </button>
        </div>
        
        <!-- HIDDEN UNTIL GENERATED -->
        <div id="pin-active-state" class="hidden">
            <p class="text-xs text-emerald-600 font-bold uppercase tracking-wider mb-1">Active Visitor PIN</p>
            <p id="generated-pin" class="text-3xl font-mono font-bold text-slate-800 tracking-widest">------</p>
            <p class="text-[10px] text-slate-500 mt-1">Valid for 24 hours at the main gate.</p>
        </div>
    </div>

    <section>
        <h3 class="text-sm font-bold text-slate-800 mb-3 ml-2">Building Access</h3>
        <div class="flex gap-3">
            <button class="w-full bg-[#e8f1fb] hover:bg-blue-100 py-4 rounded-[20px] flex flex-col items-center gap-2 tap-effect transition-colors border border-blue-50 shadow-sm"><i class="fa-solid fa-key text-blue-500 text-xl"></i><span class="text-xs font-semibold text-slate-700">Turnstiles</span></button>
        </div>
    </section>

</div>

<script>
    // Local script to handle PIN Generation on the Home Tab
    function generateVisitorPin(btn) {
        const ogText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Generating...';
        btn.disabled = true;

        setTimeout(() => {
            const pin = Math.floor(100000 + Math.random() * 900000); // Generates 6 digits
            
            // Hide the request button
            document.getElementById('pin-request-state').classList.add('hidden');
            
            // Show the active PIN block
            document.getElementById('pin-active-state').classList.remove('hidden');
            document.getElementById('generated-pin').innerText = pin;
            
            // Note: In the future, we can wire this up to n8n to log the PIN for security.
        }, 800);
    }
</script>
