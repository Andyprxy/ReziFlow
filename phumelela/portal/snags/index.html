<!-- COMPONENT LOGIC -->
<script>
    window.activeChatIntervals = window.activeChatIntervals || {};

    window.toggleSnagChat = function(ticketId) {
        const chatBody = document.getElementById(`chat-body-${ticketId}`);
        const icon = document.getElementById(`chat-icon-${ticketId}`);

        if (chatBody.classList.contains('hidden')) {
            chatBody.classList.remove('hidden');
            icon.style.transform = 'rotate(180deg)';
            
            window.fetchSnagChat(ticketId);
            
            window.activeChatIntervals[ticketId] = setInterval(() => {
                window.fetchSnagChat(ticketId);
            }, 4000);
            
        } else {
            chatBody.classList.add('hidden');
            icon.style.transform = 'rotate(0deg)';
            
            if (window.activeChatIntervals[ticketId]) {
                clearInterval(window.activeChatIntervals[ticketId]);
                delete window.activeChatIntervals[ticketId];
            }
        }
    };

    window.fetchSnagChat = async function(ticketId) {
        try {
            const response = await fetch(`https://n8n.automania.cloud/webhook-test/reziflow-snag-chat?ticket_id=${ticketId}`);
            if (!response.ok) return;
            
            const messages = await response.json();
            const chatHistory = document.getElementById(`chat-history-${ticketId}`);
            if (!chatHistory) return;

            let chatHTML = '<div class="flex justify-center"><span class="text-[9px] font-bold text-slate-400 bg-slate-50 px-3 py-1 rounded-full border border-slate-100">Live chat initialized</span></div>';

            messages.forEach(msg => {
                if (msg.sender_role === 'student') {
                    chatHTML += `
                        <div class="flex gap-2 items-end flex-row-reverse mt-2">
                            <div class="bg-blue-600 rounded-tl-xl rounded-bl-xl rounded-br-xl p-2.5 text-[11px] text-white font-medium max-w-[80%] shadow-sm">
                                ${msg.message_text}
                            </div>
                        </div>
                    `;
                } else {
                    const initial = msg.sender_name ? msg.sender_name.charAt(0).toUpperCase() : 'O';
                    chatHTML += `
                        <div class="flex gap-2 items-end mt-2">
                            <div class="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center flex-shrink-0 text-[10px] font-bold text-slate-500">${initial}</div>
                            <div class="bg-[#f5f5f7] rounded-tr-xl rounded-br-xl rounded-bl-xl p-2.5 text-[11px] text-slate-700 font-medium w-fit max-w-[80%] border border-slate-100">
                                ${msg.message_text}
                            </div>
                        </div>
                    `;
                }
            });

            if (chatHistory.innerHTML !== chatHTML) {
                chatHistory.innerHTML = chatHTML;
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }

        } catch (error) {
            console.warn('Chat sync pending...', error);
        }
    };

    window.sendSnagMessage = async function(ticketId) {
        console.log("🚀 STEP 1: Send button clicked for Ticket ID:", ticketId);

        const inputField = document.getElementById(`chat-input-${ticketId}`);
        console.log("🔍 STEP 2: Looking for input field 'chat-input-" + ticketId + "'. Found:", !!inputField);

        if (!inputField) {
            console.error("❌ ERROR: Could not find the input field in the HTML! Check your IDs.");
            return;
        }

        const text = inputField.value.trim();
        console.log("📝 STEP 3: Text grabbed from input:", text === '' ? '[EMPTY]' : text);

        if (!text) {
            console.warn("⚠️ WARNING: Text is empty. Aborting network request so we don't send blank messages.");
            return;
        }

        console.log("✅ STEP 4: All checks passed. Firing Network Request now!");

        const session = typeof getSessionData === 'function' ? getSessionData() : {}; 
        const studentName = session.First_Name || 'Resident';

        const chatHistory = document.getElementById(`chat-history-${ticketId}`);
        if (chatHistory) {
            chatHistory.insertAdjacentHTML('beforeend', `
                <div class="flex gap-2 items-end flex-row-reverse animate-[fadeIn_0.2s_ease-in] mt-2">
                    <div class="bg-blue-600 rounded-tl-xl rounded-bl-xl rounded-br-xl p-2.5 text-[11px] text-white font-medium max-w-[80%] shadow-sm opacity-70">
                        ${text}
                    </div>
                </div>
            `);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
        
        inputField.value = '';

        try {
            await fetch('https://n8n.automania.cloud/webhook-test/reziflow-snag-chats', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    ticket_id: ticketId,
                    sender_role: 'student',
                    sender_name: studentName,
                    message_text: text
                })
            });
            console.log("🌐 STEP 5: Network request completed successfully.");
        } catch (error) {
            console.error("💥 STEP 5 FAILED: Network error.", error);
        }
    };
</script>
