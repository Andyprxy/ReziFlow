<div class="space-y-5 animate-[fadeIn_0.3s_ease-in-out]">
    <div class="bg-white card-shadow soft-border rounded-[28px] p-6 text-center">
        <h2 class="text-xl font-bold text-slate-900 mb-1 tracking-tight">Maintenance</h2>
        <p class="text-sm text-slate-500 mb-6 font-medium">Report issues for your room</p>
        
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-slate-50 p-4 rounded-[20px] border border-slate-100/50 flex flex-col items-center gap-2 tap-effect cursor-pointer hover:bg-blue-50 transition-colors" onclick="openModalWithCategory('Plumbing')">
                <i class="fa-solid fa-faucet-drip text-blue-500 text-2xl mb-1"></i>
                <span class="text-xs font-bold text-slate-700">Plumbing</span>
            </div>
            <div class="bg-slate-50 p-4 rounded-[20px] border border-slate-100/50 flex flex-col items-center gap-2 tap-effect cursor-pointer hover:bg-yellow-50 transition-colors" onclick="openModalWithCategory('Electrical')">
                <i class="fa-solid fa-plug text-yellow-500 text-2xl mb-1"></i>
                <span class="text-xs font-bold text-slate-700">Electrical</span>
            </div>
            <div class="bg-slate-50 p-4 rounded-[20px] border border-slate-100/50 flex flex-col items-center gap-2 tap-effect cursor-pointer hover:bg-orange-50 transition-colors" onclick="openModalWithCategory('Furniture')">
                <i class="fa-solid fa-chair text-orange-500 text-2xl mb-1"></i>
                <span class="text-xs font-bold text-slate-700">Furniture</span>
            </div>
            <div class="bg-slate-50 p-4 rounded-[20px] border border-slate-100/50 flex flex-col items-center gap-2 tap-effect cursor-pointer hover:bg-slate-100 transition-colors" onclick="openModalWithCategory('Locks')">
                <i class="fa-solid fa-door-closed text-slate-500 text-2xl mb-1"></i>
                <span class="text-xs font-bold text-slate-700">Doors/Locks</span>
            </div>
        </div>

        <button onclick="openModal('snagModal')" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-2xl p-4 flex items-center justify-center gap-3 tap-effect shadow-md shadow-blue-500/20 transition-colors font-bold mb-6">
            <i class="fa-solid fa-plus"></i> Log New Snag
        </button>
        
        <div class="text-left border-t border-slate-100 pt-6">
            <p class="text-sm font-bold text-slate-800 mb-3">Active Tickets</p>
            <div class="p-4 bg-slate-50 rounded-[20px] border border-slate-100 text-center text-slate-500 text-sm py-8 font-medium">
                No active maintenance requests.
            </div>
        </div>
    </div>
</div>
<script>if(window.location.pathname.endsWith('/snags/') || window.location.pathname.endsWith('/snags/index.html')) window.location.href = '../';</script>
