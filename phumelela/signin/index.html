<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phumelela Residence Gateway | Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #e2e8f0;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
        }

        /* Animated Liquid Background */
        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            animation: breathe 12s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #60a5fa; animation-delay: 0s; }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: #2dd4bf; animation-delay: -4s; }
        .blob-3 { top: 40%; left: 60%; width: 40vw; height: 40vw; background: #818cf8; animation-delay: -8s; }

        @keyframes breathe {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(20px, -20px); }
        }

        /* Premium Liquid Glass Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 
                0 30px 60px -12px rgba(0,0,0,0.1), 
                0 15px 25px -10px rgba(0,0,0,0.05),
                inset 0 1px 0 rgba(255,255,255,1),
                inset 0 0 20px rgba(255,255,255,0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Translucent Inputs */
        .input-field {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1rem;
            padding: 1rem 1rem 1rem 2.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #0f172a;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15), inset 0 2px 4px rgba(0,0,0,0.01);
        }

        .input-field::placeholder { color: #64748b; font-weight: 400; }

        .password-toggle {
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            cursor: pointer;
            transition: color 0.2s ease;
            padding: 0.5rem;
        }

        .password-toggle:hover { color: #3b82f6; }

        .tap-effect:active { transform: scale(0.98); transition: transform 0.1s ease; }

        /* Modal Styles */
        .modal-overlay {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 1000;
        }
        
        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-content {
            transform: scale(0.9) translateY(30px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col relative overflow-hidden justify-center items-center py-10">

    <!-- Liquid Background Elements -->
    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="relative z-10 w-full max-w-[420px] px-5 sm:px-0 flex flex-col items-center">
        
        <!-- Phumelela Header -->
        <div class="flex flex-col items-center justify-center gap-4 mb-8 transform hover:-translate-y-1 transition-transform duration-500">
            <div class="relative">
                <div class="absolute inset-0 bg-white rounded-3xl blur-md opacity-60"></div>
                <img src="../signup/phumelela.jpg" onerror="this.src='phumelela.jpg'" alt="Phumelela Residence Logo" class="relative w-24 h-24 object-cover rounded-3xl shadow-xl shadow-blue-900/10 ring-2 ring-white/80">
            </div>
            <span class="font-black text-2xl tracking-tight text-slate-800 drop-shadow-sm text-center">Phumelela Residence</span>
        </div>

        <!-- Main Authentication Glass Card -->
        <div class="glass-panel rounded-[32px] p-8 sm:p-10 w-full relative overflow-hidden">
            
            <div class="text-center mb-8">
                <h1 class="text-xl font-black text-slate-900 mb-2 tracking-tight">Welcome Back</h1>
                <p class="text-xs text-slate-500 font-medium leading-relaxed px-4">Enter your credentials to access the resident portal.</p>
            </div>

            <form id="signinForm" onsubmit="handleSignin(event)">
                
                <div class="space-y-5 mb-6">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 pl-2">Email Address</label>
                        <div class="relative group">
                            <div class="absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors">
                                <i class="fa-solid fa-envelope"></i>
                            </div>
                            <input type="email" id="email" name="Email_Address" class="input-field" placeholder="student@email.com" required>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2 pl-2 pr-1">
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest">Password</label>
                            <button type="button" onclick="openModal('forgotModal')" class="text-[10px] font-bold text-blue-500 hover:text-blue-700 transition-colors">Forgot?</button>
                        </div>
                        <div class="relative group">
                            <div class="absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors">
                                <i class="fa-solid fa-lock"></i>
                            </div>
                            <input type="password" id="password" name="Password" class="input-field pr-12" placeholder="••••••••" required>
                            <i class="fa-solid fa-eye password-toggle" onclick="togglePassword('password', this)"></i>
                        </div>
                    </div>
                </div>

                <!-- Error Injection Target -->
                <div id="apiError" class="hidden mb-6 bg-white/60 backdrop-blur-md border border-rose-200 rounded-2xl p-3 flex items-center justify-center gap-2 text-rose-600 text-xs font-bold shadow-sm">
                    <i class="fa-solid fa-shield-xmark"></i>
                    <span id="apiErrorText">Invalid credentials. Please try again.</span>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-slate-900 hover:bg-blue-600 text-white rounded-2xl py-4 font-bold transition-all shadow-xl shadow-slate-900/20 flex items-center justify-center gap-2 tap-effect text-sm">
                    Sign In <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-300/50 text-center">
                <p class="text-xs font-medium text-slate-500">
                    Don't have an account? <br>
                    <a href="/phumelela/signup/" class="font-bold text-slate-900 hover:text-blue-600 transition-colors inline-block mt-2 px-5 py-2.5 bg-white/50 border border-white/80 rounded-xl hover:bg-white/80 shadow-sm">Sign Up Here</a>
                </p>
            </div>

        </div>

        <div class="text-center mt-8 flex items-center justify-center gap-2">
            <i class="fa-solid fa-bolt text-blue-500 text-[10px]"></i>
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest drop-shadow-sm">Engineered by Automania</p>
        </div>
    </main>

    <!-- Forgot Password Modal -->
    <div id="forgotModal" class="fixed inset-0 z-[200] modal-overlay flex items-center justify-center p-4">
        <div class="modal-content glass-panel w-full max-w-sm rounded-[32px] shadow-2xl relative p-8">
            
            <button onclick="closeModal('forgotModal')" class="absolute top-6 right-6 text-slate-400 hover:text-slate-800 transition-colors">
                <i class="fa-solid fa-times text-xl"></i>
            </button>

            <h2 class="text-xl font-black text-slate-900 mb-2 tracking-tight">Reset Password</h2>
            <p class="text-slate-500 mb-6 text-xs font-medium leading-relaxed">
                Enter your registered email address to receive a secure reset link.
            </p>

            <form id="forgotForm" onsubmit="handleForgotPassword(event)">
                <div class="mb-5">
                    <div class="relative group">
                        <div class="absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <input type="email" id="forgotEmail" class="input-field" placeholder="student@email.com" required>
                    </div>
                </div>

                <!-- Forgot Password Feedback Messages -->
                <div id="forgotFeedback" class="hidden mb-5 rounded-2xl p-3 flex items-center justify-center gap-2 text-xs font-bold text-center border">
                    <!-- Dynamic Content Injected Here -->
                </div>

                <button type="submit" id="forgotBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-2xl py-3.5 font-bold transition-all shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 tap-effect text-sm">
                    Send Reset Link
                </button>
            </form>
        </div>
    </div>

    <!-- LIVE LOGIC ENGINE -->
    <script>
        // Utilities
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconElement.classList.replace("fa-eye", "fa-eye-slash");
                iconElement.classList.add("text-blue-600");
            } else {
                input.type = "password";
                iconElement.classList.replace("fa-eye-slash", "fa-eye");
                iconElement.classList.remove("text-blue-600");
            }
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // 1. Handle Main Sign In
        async function handleSignin(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const apiErrorBox = document.getElementById('apiError');
            const apiErrorText = document.getElementById('apiErrorText');
            const submitBtn = document.getElementById('submitBtn');

            // Reset Error States
            apiErrorBox.classList.add('hidden');
            submitBtn.classList.remove('bg-rose-500', 'shadow-rose-500/20');
            submitBtn.classList.add('bg-slate-900', 'hover:bg-blue-600');

            // Loading State UI
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';
            submitBtn.disabled = true;

            try {
                // TEST WEBHOOK FOR SIGNIN
                const response = await fetch('https://n8n.automania.cloud/webhook/reziflow-signin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Email_Address: email, Password: password })
                });

                const data = await response.json();

                if (data.status === 'error' || !response.ok) {
                    throw new Error(data.message || "Invalid credentials. Please try again.");
                }

                // Success - Redirect to Dashboard
                submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Verified';
                submitBtn.classList.replace('bg-slate-900', 'bg-emerald-500');
                
                // Redirect user after brief delay
                setTimeout(() => {
                    window.location.href = '/resident/dashboard/'; 
                }, 1000);

            } catch (error) {
                // Error - Access Denied
                apiErrorText.textContent = error.message;
                apiErrorBox.classList.remove('hidden');
                
                submitBtn.innerHTML = 'Sign In Failed - Retry';
                submitBtn.disabled = false;
                submitBtn.classList.remove('bg-slate-900', 'hover:bg-blue-600');
                submitBtn.classList.add('bg-rose-500', 'shadow-rose-500/20');
            }
        }

        // 2. Handle Forgot Password 
        async function handleForgotPassword(e) {
            e.preventDefault();

            const email = document.getElementById('forgotEmail').value;
            const forgotBtn = document.getElementById('forgotBtn');
            const feedbackBox = document.getElementById('forgotFeedback');

            feedbackBox.classList.add('hidden');
            feedbackBox.className = 'hidden mb-5 rounded-2xl p-3 flex items-center justify-center gap-2 text-xs font-bold text-center border';
            forgotBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying...';
            forgotBtn.disabled = true;

            try {
                // TEST WEBHOOK FOR FORGOT PASSWORD
                const response = await fetch('https://n8n.automania.cloud/webhook/reziflow-forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Email_Address: email })
                });

                const data = await response.json();

                if (data.status === 'error' || !response.ok) {
                    throw new Error(); 
                }

                feedbackBox.classList.remove('hidden');
                feedbackBox.classList.add('bg-emerald-50/80', 'border-emerald-200', 'text-emerald-700');
                feedbackBox.innerHTML = `<i class="fa-solid fa-check-circle text-emerald-500"></i> Verification link sent! Check your inbox.`;
                
                forgotBtn.innerHTML = 'Send Reset Link';
                forgotBtn.disabled = false;
                document.getElementById('forgotEmail').value = ''; 

            } catch (error) {
                feedbackBox.classList.remove('hidden');
                feedbackBox.classList.add('bg-rose-50/80', 'border-rose-200', 'text-rose-700');
                feedbackBox.innerHTML = `<i class="fa-solid fa-circle-exclamation text-rose-500"></i> Email not recognized; go sign up.`;
                
                forgotBtn.innerHTML = 'Retry';
                forgotBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
