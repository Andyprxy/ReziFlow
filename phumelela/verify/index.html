<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying Account | Phumelela Residence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #e2e8f0; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-5">

    <div class="glass-panel rounded-[32px] p-10 w-full max-w-sm text-center relative overflow-hidden">
        
        <!-- Loading State -->
        <div id="loadingState" class="block">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-600 mb-4"></i>
            <h2 class="text-xl font-black text-slate-900 mb-2">Verifying Link...</h2>
            <p class="text-sm text-slate-500 font-medium">Securing your connection to the ReziFlow gateway.</p>
        </div>

        <!-- Success State -->
        <div id="successState" class="hidden">
            <div class="w-16 h-16 mx-auto bg-emerald-100 rounded-full flex items-center justify-center mb-4 text-emerald-500 text-3xl">
                <i class="fa-solid fa-check-circle"></i>
            </div>
            <h2 class="text-xl font-black text-slate-900 mb-2">Account Verified!</h2>
            <p class="text-sm text-slate-500 font-medium mb-6">Your profile is now active.</p>
            <a href="/phumelela/signin/" class="inline-block w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-blue-600 transition-colors">Proceed to Sign In</a>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden">
            <div class="w-16 h-16 mx-auto bg-rose-100 rounded-full flex items-center justify-center mb-4 text-rose-500 text-3xl">
                <i class="fa-solid fa-circle-xmark"></i>
            </div>
            <h2 class="text-xl font-black text-slate-900 mb-2">Verification Failed</h2>
            <p id="errorMsg" class="text-sm text-slate-500 font-medium mb-6">This link is invalid or has expired.</p>
            <a href="/phumelela/signup/" class="inline-block w-full bg-slate-200 text-slate-800 font-bold py-3 rounded-xl hover:bg-slate-300 transition-colors">Return to Sign Up</a>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Grab the token from the URL (e.g. ?token=xyz123)
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                showError("No verification token found in the URL.");
                return;
            }

            try {
                // Post to the n8n backend securely
                const response = await fetch('https://n8n.automania.cloud/webhook-test/reziflow-verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('successState').classList.remove('hidden');
                } else {
                    throw new Error(data.message || "Invalid or expired link.");
                }
            } catch (error) {
                showError(error.message);
            }
        });

        function showError(message) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('errorState').classList.remove('hidden');
            document.getElementById('errorMsg').textContent = message;
        }
    </script>
</body>
</html>
