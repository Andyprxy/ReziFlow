<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phumelela Residence | Verify Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #e2e8f0; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }

        .liquid-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; z-index: 0; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); }
        .blob { position: absolute; filter: blur(80px); opacity: 0.6; animation: breathe 12s infinite alternate cubic-bezier(0.4, 0, 0.2, 1); }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #60a5fa; animation-delay: 0s; }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: #2dd4bf; animation-delay: -4s; }
        .blob-3 { top: 40%; left: 60%; width: 40vw; height: 40vw; background: #818cf8; animation-delay: -8s; }
        @keyframes breathe { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.1) translate(20px, -20px); } }

        .glass-panel { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(40px) saturate(150%); -webkit-backdrop-filter: blur(40px) saturate(150%); border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: 0 30px 60px -12px rgba(0,0,0,0.1), 0 15px 25px -10px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,1), inset 0 0 20px rgba(255,255,255,0.5); }
        .tap-effect:active { transform: scale(0.98); transition: transform 0.1s ease; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col relative overflow-hidden justify-center items-center py-10">

    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="relative z-10 w-full max-w-[420px] px-5 sm:px-0 flex flex-col items-center">
        <div class="flex flex-col items-center justify-center gap-4 mb-8">
            <div class="relative">
                <div class="absolute inset-0 bg-white rounded-3xl blur-md opacity-60"></div>
                <img src="../signup/phumelela.jpg" onerror="this.src='phumelela.jpg'" alt="Logo" class="relative w-24 h-24 object-cover rounded-3xl shadow-xl shadow-blue-900/10 ring-2 ring-white/80">
            </div>
            <span class="font-black text-2xl tracking-tight text-slate-800 drop-shadow-sm text-center">Phumelela Residence</span>
        </div>

        <div class="glass-panel rounded-[32px] p-8 sm:p-10 w-full relative overflow-hidden text-center">
            <h2 class="text-xl font-black text-slate-900 mb-2">Almost There!</h2>
            <p class="text-sm text-slate-500 mb-8 font-medium leading-relaxed">Click the button below to officially activate your account and access the portal.</p>
            
            <button id="verifyBtn" onclick="executeVerification()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl py-4 font-bold transition-all shadow-xl shadow-emerald-500/20 tap-effect flex items-center justify-center gap-2">
                <i class="fa-solid fa-shield-check"></i> Activate My Account
            </button>

            <div id="statusMessage" class="hidden mt-6 p-4 rounded-xl text-sm font-bold shadow-sm"></div>
        </div>
    </main>

    <script>
        async function executeVerification() {
            const btn = document.getElementById('verifyBtn');
            const statusBox = document.getElementById('statusMessage');
            
            // Extract the token from the URL the email sent them to
            const token = new URLSearchParams(window.location.search).get('token');

            if (!token) {
                statusBox.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-700');
                statusBox.classList.add('bg-rose-50', 'text-rose-700');
                statusBox.textContent = "No verification token found in URL.";
                return;
            }

            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Activating...';
            btn.disabled = true;

            try {
                // Pointing to your active production webhook
                const res = await fetch('https://n8n.automania.cloud/webhook/reziflow-verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ token: token })
                });
                
                const data = await res.json();

                if (data.status === 'success') {
                    btn.classList.add('hidden'); // Hide button on success to prevent double clicks
                    statusBox.classList.remove('hidden', 'bg-rose-50', 'text-rose-700');
                    statusBox.classList.add('bg-emerald-50', 'text-emerald-700');
                    statusBox.innerHTML = '<i class="fa-solid fa-circle-check text-lg mb-2 block"></i> Account Verified!<br><a href="/phumelela/signin/" class="underline mt-2 inline-block hover:text-emerald-900">Click here to sign in</a>';
                } else {
                    throw new Error(data.message || "Verification failed.");
                }
            } catch (err) {
                btn.innerHTML = 'Retry Activation';
                btn.disabled = false;
                statusBox.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-700');
                statusBox.classList.add('bg-rose-50', 'text-rose-700');
                statusBox.textContent = err.message || "Link may be expired or invalid.";
            }
        }
    </script>
</body>
</html>
